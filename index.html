<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Protocolo LT</title>
<meta name="description" content="Protocolo digital de leishmaniose tegumentar – apoio ao atendimento na Atenção Primária (MS 2017).">
<meta name="theme-color" content="#062F38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protocolo LT">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: app shell — barra lateral no notebook, barra inferior no celular; cartões só onde há decisão clínica */
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --surface2:#E7EFEF; --line:#CFDCDC;
  --fg:#10282C; --muted:#4F6669; --teal:#0E5A6B; --teal-ink:#0B4A58; --teal-soft:#D6EBEE;
  --gold:#B8901A; --gold-soft:#F6ECC8;
  --ok:#1E7A46; --ok-soft:#DDF1E4; --warn:#9A6A00; --warn-soft:#FBF0CF; --bad:#B3261E; --bad-soft:#FBE1DE;
  --head:#062F38; --head-fg:#F4FAFB;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A171A; --surface:#122428; --surface2:#183035; --line:#26444A;
  --fg:#E4F0F1; --muted:#9DB5B8; --teal:#5FB8C8; --teal-ink:#8FD3DF; --teal-soft:#16363D;
  --gold:#E2BE55; --gold-soft:#3A3115;
  --ok:#6BCB8F; --ok-soft:#173A26; --warn:#E8BE4F; --warn-soft:#3B3014; --bad:#FF8A80; --bad-soft:#44201D;
  --head:#04191E; --head-fg:#F4FAFB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A171A; --surface:#122428; --surface2:#183035; --line:#26444A;
  --fg:#E4F0F1; --muted:#9DB5B8; --teal:#5FB8C8; --teal-ink:#8FD3DF; --teal-soft:#16363D;
  --gold:#E2BE55; --gold-soft:#3A3115;
  --ok:#6BCB8F; --ok-soft:#173A26; --warn:#E8BE4F; --warn-soft:#3B3014; --bad:#FF8A80; --bad-soft:#44201D;
  --head:#04191E; --head-fg:#F4FAFB; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num{font-variant-numeric:tabular-nums}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-fg);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.top img{width:36px;height:36px;border-radius:9px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--font-d);font-size:1.02rem;letter-spacing:.02em}
.brand span{font-size:.72rem;color:#9FC6CD;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.saved{font-size:.75rem;color:#BFE3C9;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.pchip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:.8rem;
  max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--head-fg)}

/* estrutura */
.shell{display:flex;min-height:calc(100% - 52px)}
.side{display:none}
main{flex:1;min-width:0;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--teal-ink)}
.tabs a.on svg{stroke:var(--teal-ink)}
@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;width:236px;flex:none;padding:16px 10px;border-right:1px solid var(--line);background:var(--surface);
    position:sticky;top:calc(52px + env(safe-area-inset-top,0px));height:calc(100vh - 52px - env(safe-area-inset-top,0px));overflow:auto}
  .side .grp{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
  .side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:.92rem}
  .side a svg{width:18px;height:18px;flex:none;stroke:var(--muted)}
  .side a:hover{background:var(--surface2)}
  .side a.on{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
  .side a.on svg{stroke:var(--teal-ink)}
  main{padding-bottom:40px}
}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel>h2{margin-bottom:10px}
.lead{color:var(--muted);margin:4px 0 0;max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:1100px){.split{grid-template-columns:minmax(0,1fr) 360px}.split .stick{position:sticky;top:76px;align-self:start}}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;
  cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);min-height:42px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#04191E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#04191E}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
.btn svg{width:18px;height:18px}

/* hero */
.hero{background:var(--head);color:var(--head-fg);border-radius:14px;padding:22px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -90px auto;width:260px;height:260px;border-radius:50%;border:16px solid rgba(201,162,39,.18)}
.hero img{width:84px;height:84px;border-radius:20px;flex:none}
.hero .t{min-width:0;flex:1 1 260px;position:relative;z-index:1}
.hero .eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#F2D16B}
.hero h1{font-size:1.6rem;margin:4px 0}
.hero p{margin:0;color:#BFDCE1;font-size:.9rem}

/* percurso */
.path{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.path{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.path{grid-template-columns:repeat(6,1fr)}}
.step{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--surface2);text-decoration:none;color:var(--fg);border:1px solid transparent}
.step:hover{border-color:var(--teal)}
.step b{font-size:.9rem}
.step small{color:var(--muted);font-size:.78rem}
.step .n{font-family:var(--mono);font-size:.72rem;color:var(--gold)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:12px;border-radius:8px;background:var(--surface2)}
.stat b{display:block;font-size:1.7rem;font-family:var(--font-d);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.bad b{color:var(--bad)}

/* lista */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:hover{background:var(--surface2)}
.item .code{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{grid-column:2/4;font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--ok)} .dot.y{background:var(--warn)} .dot.r{background:var(--bad)}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.t{background:var(--teal-soft);color:var(--teal-ink)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.pill.y{background:var(--warn-soft);color:var(--warn)}
.pill.g{background:var(--ok-soft);color:var(--ok)}
.pill.ex{background:var(--gold-soft);color:var(--gold)}

/* formulário */
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h3{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);padding-top:6px;border-top:1px solid var(--line);padding-top:14px}
.sec:first-child>h3{border-top:0;padding-top:0}
.fgrid{display:grid;grid-template-columns:1fr;gap:12px 14px}
@media (min-width:620px){.fgrid{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.w{grid-column:1/-1}
.f>label,.f>.lb{font-size:.83rem;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;min-height:42px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.86rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#04191E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#04191E}}
.hint{font-size:.78rem;color:var(--muted)}
.calcv{padding:9px 11px;border-radius:8px;background:var(--surface2);min-height:42px;display:flex;align-items:center;font-variant-numeric:tabular-nums}

/* resultado clínico */
.res{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.box{border-radius:8px;padding:10px 12px;font-size:.9rem;border:1px solid transparent}
.box.t{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal) 30%,transparent)}
.box.r{background:var(--bad-soft);color:var(--fg);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.box.y{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.box.g{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.box b.lbl{display:block;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
.box.r b.lbl{color:var(--bad)} .box.y b.lbl{color:var(--warn)} .box.g b.lbl{color:var(--ok)} .box.t b.lbl{color:var(--teal-ink)}
ul.al{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pg{font-family:var(--mono);font-size:.78em;color:var(--teal-ink);white-space:nowrap}

/* calculadora */
.rx{display:flex;flex-direction:column;gap:10px}
.rxi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr;gap:6px;background:var(--surface)}
.rxi.ind{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.rxi.opt{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.rxi.ci{box-shadow:inset 4px 0 0 var(--bad)}
.rxi h3{font-size:.98rem}
.rxn{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem}
.rxn span b{font-variant-numeric:tabular-nums}
.rxi p{margin:0;font-size:.82rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* SOAP */
.soap{display:flex;flex-direction:column;gap:12px}
.sb{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.sb header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--surface2)}
.sb header b{font-family:var(--font-d)}
.sb pre{margin:0;padding:12px;white-space:pre-wrap;font:14px/1.55 var(--font);overflow-wrap:anywhere}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-size:.76rem;letter-spacing:.04em;color:var(--muted);font-weight:700;position:sticky;top:0}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.soon td{background:var(--warn-soft)}
.past{color:var(--muted);text-decoration:line-through}

/* texto */
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.prose p{margin:0}
.card-k{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.card-k>div{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line)}
@media (min-width:700px){.card-k>div{grid-template-columns:170px minmax(0,1fr);gap:16px}}
.card-k b{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink)}
.card-k span{white-space:pre-line;font-size:.92rem}
.card-k>div.al b{color:var(--bad)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px}
.empty{padding:24px 12px;text-align:center;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--bad-soft)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--head-fg);
  padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
.ftr{font-size:.78rem;color:var(--muted);text-align:center;padding:8px 0}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.picker select{flex:1 1 220px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-width:0}

/* ficha impressa */
.ficha{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-size:12.5px}
.ficha h2{font-size:15px;text-align:center;margin-bottom:4px;color:#111}
.ficha .fh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #0E5A6B;padding-bottom:8px;margin-bottom:10px}
.ficha .fh img{width:48px;height:48px}
.ficha h4{margin:12px 0 4px;font-size:12px;background:#E6F0F2;color:#0B4A58;padding:4px 6px;letter-spacing:.05em;text-transform:uppercase}
.ficha .g{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.ficha .g div{border-bottom:1px dotted #bbb;padding:2px 0;display:flex;gap:6px}
.ficha .g div i{font-style:normal;color:#555;flex:none}
.ficha .w1{grid-column:1/-1}
.ficha table{font-size:11px} .ficha th{background:#E6F0F2;color:#333;position:static} .ficha th,.ficha td{border:1px solid #ccc;padding:3px 5px}
.ficha .sig{margin-top:22px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.ficha .sig span{border-top:1px solid #333;padding-top:3px;min-width:220px;text-align:center;font-size:11px}
.ficha .ft{font-size:10px;color:#555;margin-top:12px}
@media (max-width:560px){.ficha .g{grid-template-columns:1fr}}

@media print{
  body{background:#fff} body::before{display:none}
  .top,.side,.tabs,.noprint,.toast{display:none!important}
  main{padding:0!important} .wrap{max-width:none}
  .ficha{border:0;padding:0}
  .printable{display:block!important}
  .card-k{border:0} .card-k>div{grid-template-columns:150px 1fr;break-inside:avoid;padding:6px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.brand b{white-space:nowrap}
@media (max-width:440px){.brand span{display:none}.top img{width:32px;height:32px}}

</style>
<script>window.LT_SW=true;</script>

cfReTwR7oYg9j+2Dpr/WM71IU3AbZ8ZVbDtGTkSjcirxHIq6QwS4FZtiMTji0mkbdKm3C0ow3nn+idv+c4/gAIKcX46Eow8RDKDwyBr0tAlzbihEG/4tX0noFi7dC9n+saeat9/P8CX8I4evv6dXL9+h16PPueXL7z6Jxoy/ToHOOoyyK2uAzNQssSLUbTJCVTDCJttElKKwxmAG0wWhktpCgKTF5rhoWkRynTiaS9FphW4Vutnf3V7IObs9XXXXhy+/Z1cv32HVr8njPiS1n+D4dn1zucN0paAAAAAElFTkSuQmCC", "cartao": [["SUSPEITA", "Lesão de pele ulcerada ou não com 3 semanas ou mais, em quem vive ou esteve em área de transmissão; ou lesão de mucosa nasal/oral [p.112]. Úlcera típica: indolor, bordas elevadas e firmes, fundo granuloso avermelhado [p.41-42]. SEMPRE examinar a mucosa [p.54-55]."], ["DIAGNÓSTICO", "Exame direto (escarificação da borda) é a 1ª escolha. Montenegro pode ser negativa nas primeiras 4-6 semanas. Exames negativos → centro de referência [p.66-69, 164]. Oferecer sorologia HIV a TODOS [p.63]."], ["NOTIFICAR", "Todo caso confirmado no SINAN (ficha do Anexo J) [p.113]."], ["1ª ESCOLHA", "Cutânea localizada: antimoniato de meglumina 15 mg Sb+5/kg/dia (10-20), EV ou IM, por 20 dias [p.91-92].\nÁrea de L. guyanensis: pentamidina 4 mg/kg/dia, 3 doses (72/72 h IM ou 48/48 h EV), máx. 300 mg/dose [p.91-92].\nLesão única ≤3 cm, fora de cabeça e região periarticular, sem imunossupressão: antimoniato intralesional, 1 a 3 sessões a cada 15 dias, só profissional capacitado [p.90, 93-94].\nDisseminada: antimoniato 20 mg/kg/dia por 30 dias, de preferência no centro de referência [p.95-96]. Difusa: pentamidina 4 mg/kg em dias alternados, 10 doses, no centro de referência [p.97-98].\nMucosa: antimoniato 20 mg/kg/dia por 30 dias + pentoxifilina 400 mg 8/8 h por 30 dias (acima de 12 anos), com otorrino no centro de referência [p.99-100]."], ["CONTA DO ANTIMONIATO", "Ampola 5 mL = 405 mg Sb+5 (81 mg/mL). Dose (mg) = peso × mg/kg. Volume (mL) = mg ÷ 81. MÁXIMO 1.215 mg/dia = 3 ampolas = 15 mL [p.74, 91-92].\nExemplo do manual: 60 kg × 15 mg/kg = 900 mg = 11,1 mL ≈ 2 ampolas [p.76]."], ["ENCAMINHAR", "Centro de referência (anfotericina B lipossomal ou desoxicolato): gestante, 50 anos ou mais, cardiopatia, nefropatia, hepatopatia, transplantado, HIV/imunossupressão, forma mucosa, disseminada ou difusa, falha terapêutica [p.101-104].\nAcre: SAE Rio Branco, (68) 3223-8571 / 3223-8353 (dados de 2017, confirmar) [p.179]."], ["CONTRAINDICAÇÕES", "Antimoniato: gestação; evitar em 50 anos ou mais e em cardio/nefro/hepatopatas [p.73, 75]. Pentamidina: gestação, lactação, menor de 1 ano, diabetes, doença renal, hepática ou cardíaca [p.83]. Pentoxifilina: menor de 12 anos, gestante, lactante, HIV/imunossupressão [p.86-87]."], ["MONITORAR", "Durante o antimoniato: ECG, hemograma, ureia/creatinina, amilase/lipase, TGO/TGP/bilirrubinas SEMANAIS; ausculta cardíaca; repouso relativo e sem álcool [p.73-75]. Ototóxico: atenção a zumbido e perda auditiva [p.75]."], ["ALARME: SUSPENDER E NOTIFICAR", "Arritmia ou QT prolongado, insuficiência renal aguda, icterícia ou transaminases acima de 5x o normal, pancreatite ou amilase/lipase acima de 5x o normal, óbito. NA DÚVIDA, NOTIFIQUE [p.73-74]."], ["CURA E SEGUIMENTO", "Cura cutânea: epitelização completa até 90 dias e sem crosta, descamação, infiltração ou eritema até 180 dias [p.105]. Sem epitelização em 90 dias, piora ou lesão nova: 2º esquema [p.105].\nRetornos: mensais por 3 meses após o fim (HIV: 6 meses); curado, de 2 em 2 meses até 12 meses [p.107]."], ["Elaborado por Edjan da Silva Santos – Interno de Medicina, UFAC (Turma 30). Apoio à decisão: a conduta final é do médico responsável.", ""]], "protocolo": [["Caso suspeito – cutânea", "Lesão de pele ulcerada ou não com 3 semanas ou mais de evolução, em residente ou exposto a área de transmissão.", "p.112"], ["Caso suspeito – mucosa", "Lesão de mucosa de vias aéreas superiores, principalmente nasal, em residente ou exposto a área de transmissão.", "p.112"], ["Caso confirmado", "Clínico-laboratorial: área de transmissão + parasito (direto/indireto) OU intradermorreação de Montenegro (IDRM) positiva OU outro método positivo. Clínico-epidemiológico: suspeita clínica sem acesso a exame + área de transmissão (na mucosa, cicatriz cutânea reforça).", "p.112"], ["Úlcera típica", "Indolor, área exposta, redonda/oval, base eritematosa infiltrada e firme, bordas elevadas bem delimitadas, fundo avermelhado com granulações grosseiras. Pode ter linfadenopatia satélite e linfangite nodular (esporotricoide).", "p.41-42"], ["Exame da mucosa", "Sempre examinar mucosas de quem tem forma cutânea: lesões mucosas iniciais podem ser assintomáticas. Maior risco de forma mucosa: lesões múltiplas, extensas, >1 ano, acima da cintura.", "p.54-55"], ["HIV", "Oferecer sorologia para HIV a TODOS os pacientes com leishmaniose tegumentar, independentemente da idade. Quadro 2: situações que sugerem coinfecção (disseminada, mucosa fora do nariz, Montenegro negativo, falha, recidiva tardia...).", "p.63-64"], ["Diagnóstico – fluxo cutâneo", "Suspeito → exame direto e/ou intradermorreação de Montenegro (IDRM). Direto positivo = confirmado → tratar. Negativos → centro de referência para investigar leishmaniose tegumentar e diferenciais. IDRM positiva com direto negativo → considerar prova terapêutica.", "p.69 (Fluxograma 1)"], ["Diagnóstico – fluxo mucoso", "Suspeito de leishmaniose mucosa → centro de referência (cultura, IDRM, PCR, histopatologia, rinoscopia, orofaringoscopia).", "p.70 (Fluxograma 2)"], ["Exame direto", "1ª escolha (rápido, barato). Sensibilidade cai com o tempo de lesão (rara após 1 ano) e com infecção secundária (tratar antes). Escarificação da borda interna da úlcera; lavar com água e sabão, álcool 70%; 1-3 lâminas; fixar em metanol em até 12 h.", "p.67, 164"], ["Intradermorreação de Montenegro", "Pode ser negativa nas primeiras 4-6 semanas; depois positiva em >90%. Negativa com lesão >6 semanas → outras provas e diferencial. Na forma mucosa costuma ser exacerbada; na difusa, negativa. Pode ficar positiva anos após cura.", "p.66-67"], ["Diagnóstico diferencial forma cutânea", "Tuberculose, micobacterioses atípicas, paracoccidioidomicose, úlcera venosa, anemia falciforme, picada de inseto, corpo estranho, ceratoacantoma, CBC, CEC, linfoma, esporotricose, cromoblastomicose, piodermite, trauma.", "p.51-52"], ["Notificação", "Doença de notificação compulsória: todo caso CONFIRMADO notificado e investigado na ficha SINAN (Anexo J). Preencher todos os campos, mesmo negativos/ignorados. Caso importado: notificar também ao município provável de infecção. Para encerrar no SINAN não precisa esperar fim do seguimento.", "p.105, 113, 171-172"], ["Investigação", "Registrar deslocamentos para áreas endêmicas nos 6 meses antes do início dos sintomas; outras pessoas com lesões semelhantes; definir local provável de infecção.", "p.114"], ["Antes de tratar", "Medir as lesões. Avaliar contraindicações. Avaliação clínica antes e durante: ECG, hemograma, ureia/creatinina, amilase/lipase, TGO/TGP, bilirrubinas, GGT, FA. Repouso relativo e sem álcool.", "p.73, 89"], ["forma cutânea localizada – 1ª escolha", "Antimoniato EV/IM 15 mg Sb+5/kg/dia (10-20) por 20 dias, máx 3 amp (1.215 mg)/dia. Exceto comorbidade renal/hepática/cardíaca, gestantes e ≥50 anos → anfotericina B lipossomal. 2ª escolha: desoxicolato de anfotericina B ou pentamidina.", "p.90-92"], ["forma cutânea localizada – intralesional", "Lesão única até 3 cm, exceto cabeça e periarticular, sem imunossupressão (inclui recidiva cútis): antimoniato intralesional ~5 mL/sessão, 1-3 sessões a cada 15 dias, só profissional capacitado. Reavaliar a cada 15 dias até 120 dias.", "p.90, 93-94"], ["forma cutânea localizada – área de L. guyanensis", "Pentamidina 4 mg/kg/dia, 3 doses (72 h IM / 48 h EV), máx 300 mg/dose. Exceto renal/hepática/cardíaca, diabetes, gestante, lactante.", "p.91-92"], ["Espécies no Acre", "Anexo D (dados de 2005): AC tem L. braziliensis, L. lainsoni, L. guyanensis e L. amazonensis. O manual NÃO diz qual predomina em Feijó: confirmar com a vigilância municipal.", "p.159"], ["Recidiva cútis", "Tratar/retratar como forma cutânea localizada. Após 2 esquemas sem resposta → centro de referência.", "p.95"], ["Disseminada", "Preferencialmente centro de referência. Antimoniato 20 mg/kg/dia x 30 dias; lipossomal se ≥50 anos, comorbidade, gestante, grave ou >20 lesões (2-3 mg/kg/dia até 35-40 mg/kg).", "p.95-97"], ["Difusa", "Centro de referência. Pentamidina 4 mg/kg/dia em dias alternados, 10 doses.", "p.97-98"], ["Mucosa", "Preferencialmente centro de referência com otorrino. Antimoniato 20 mg/kg/dia x 30 dias + pentoxifilina 400 mg 8/8h x 30 dias (>12 anos). Lesão de laringe/faringe: internação (risco de edema/insuficiência respiratória), pode-se usar hidrocortisona 100 mg EV 6/6h por 48-72 h.", "p.99-100"], ["Gestante", "Antimoniato contraindicado. Avaliar adiar para pós-parto; se não der, centro de referência com anfotericina B lipossomal.", "p.73, 101"], ["Lactante", "Antimoniato pode ser usado (pouca excreção no leite). Pentamidina contraindicada. Lipossomal: interromper amamentação.", "p.80, 83, 101"], ["Criança", "Esquema do antimoniato igual ao do adulto. Pentamidina CI <1 ano. Pentoxifilina CI <12 anos.", "p.74, 83, 99"], ["≥50 anos / cardio / nefro / hepatopata / transplantado", "Anfotericina B lipossomal 1ª escolha, em centro de referência. Se antimoniato for usado: ECG 2x/semana.", "p.75, 101"], ["HIV / imunossupressão", "Desoxicolato de anfotericina B 1ª escolha (lipossomal se ≥50 anos/comorbidade/gestante). Antimoniato só como 2ª escolha, dose 15 mg/kg. Seguimento por tempo indeterminado; otorrino semestral no 1º ano.", "p.102-104"], ["Monitorização antimoniato", "ECG + hemograma + bioquímica SEMANAIS; ausculta cardíaca diária. ECG: QTc longo é o efeito mais grave. Ototóxico (audiometria em mulheres, idosos, perda auditiva prévia; considerar 5 mg/kg).", "p.73-75, 109-110"], ["Notificar reação adversa grave", "Arritmia, IRA, insuficiência hepática, icterícia ou transaminases Mais de 5x o normal, pancreatite ou amilase/lipase Mais de 5x o normal, óbito. NA DÚVIDA, NOTIFIQUE.", "p.74"], ["Troca antimoniato → anfotericina", "Iniciar desoxicolato só 14 dias após o fim do antimoniato (toxicidade cardíaca/renal).", "p.77, 79"], ["Cuidados locais", "Limpeza com água e sabão; se possível, compressa de permanganato de potássio 1:5.000 (rosa claro). Infecção secundária: cultura se possível e antibiótico. Eczema de contato: corticoide tópico.", "p.91, 109-110"], ["Critério de cura – cutânea", "Epitelização completa de todas as lesões + desaparecimento de crosta, descamação, infiltração e eritema. Epitelização esperada até 90 dias; sinais residuais somem até 180 dias (observar sem tratar se melhora progressiva).", "p.105"], ["2º esquema", "Sem epitelização completa até 90 dias, piora ou lesão nova a qualquer momento.", "p.105"], ["Critério de cura – mucosa", "Regressão de todos os sinais, comprovada por exame otorrino até 6 meses após o fim. Sem especialista: rinoscopia anterior e oroscopia.", "p.107"], ["Seguimento", "Mensal por 3 meses após o fim (HIV: 6 meses). Curado: de 2 em 2 meses até 12 meses após o tratamento.", "p.107, 113"], ["Definições de evolução", "Regular; irregular (passou do tempo previsto); falha = 2 esquemas regulares sem cura; recidiva = nova lesão após cura; abandono = sem cura constatada e não voltou até 30 dias após o 3º agendamento (3º mês).", "p.107-108"], ["Condutas por situação", "Irregular >50% das doses: curado → alta; melhora → observar 3 meses; sem melhora → reiniciar. <50% → reiniciar. Falha → 2ª escolha. Recidiva/abandono → reiniciar 1ª escolha.", "p.108-109"], ["Centro de referência no Acre", "Estadual: SAE, BR-364 km 2, Estrada Dias Martins, Distrito Industrial, Rio Branco, tel. (68) 3223-8571 / 3223-8353. Municipal: URAP Augusto Hidalgo de Lima, Rua Tião Natureza 271, Palheiral, Rio Branco, tel. (68) 3225-6495 / 3242-0490. (Dados de 2017, confirmar.)", "p.179"], ["FORA DO MATERIAL – confirmar", "O manual é de 2017. Depois dele o MS incorporou a miltefosina oral para leishmaniose tegumentar no SUS (Portaria SCTIE/MS nº 56/2018) /* datas (ISO aaaa-mm-dd, sem fuso) */
function pd(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3]);}
function iso(d){if(!d)return'';return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function today(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
function addD(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function edate(d,m){const y=d.getFullYear(),mo=d.getMonth()+m,day=d.getDate();const last=new Date(y,mo+1,0).getDate();return new Date(y,mo,Math.min(day,last));}
function diff(a,b){return Math.round((a-b)/86400000);}
function fd(x){const d=typeof x==='string'?pd(x):x;if(!d)return'';return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function years(b,t){let y=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate()))y--;return y;}
function code(n){return 'LT-'+String(n).padStart(3,'0');}

const INTRAL='; OPÇÃO: antimoniato intralesional (só profissional capacitado) [p.90, 93]';

function calc(p){
  const r={};
  const nasc=pd(p.nasc);
  r.idade=nasc?years(nasc,today()):null;
  const age=r.idade;
  const gest=p.gest===1, lact=p.lact===1, hivPos=p.hiv===2, imuno=p.imuno===1, imm=hivPos||imuno;
  const comorb=p.comorb===1, dm=p.dm===1, old=isNum(age)&&age>=50;
  const muc=p.forma===5, dis=p.forma===3, dif=p.forma===4;
  r.flags={gest,lact,hivPos,imuno,imm,comorb,dm,old,muc,dis,dif};
  r.confirmado=p.direto===1||p.idrm===1||p.histo===1;
  r.criterio=r.confirmado?'Clínico-laboratorial [p.112]':'Clínico-epidemiológico (só se sem acesso a exame) [p.112]';
  r.encaminhar=gest||imm||old||comorb||muc||dis||dif||p.mucosa===2||p.sit===6;
  r.encTxt=r.encaminhar?'SIM – centro de referência':'Não (rede básica, se houver monitorização)';
  const intral=(p.nles===1&&isNum(p.diam)&&p.diam<=3&&p.local!==1&&p.local!==2)?INTRAL:'';
  let t;
  if(gest) t='Anfotericina B lipossomal (avaliar adiar para pós-parto) – CENTRO DE REFERÊNCIA [p.101]';
  else if(imm) t=(old||comorb)?'Anfotericina B lipossomal – REFERÊNCIA [p.102]':'Desoxicolato de anfotericina B – REFERÊNCIA/Serviço de Assistência Especializada [p.102-104]';
  else if(old||comorb) t='Anfotericina B lipossomal – CENTRO DE REFERÊNCIA [p.90, 101]';
  else if(dif) t=(dm||lact)?'Pentamidina contraindicada (diabetes/lactante): 2ª escolha – REFERÊNCIA [p.98]':'Pentamidina 4 mg/kg/dia, dias alternados, 10 doses – REFERÊNCIA [p.97-98]';
  else if(muc){
    if(isNum(age)&&age<12) t='Antimoniato 20 mg Sb+5/kg/dia x 30 dias, SEM pentoxifilina (<12 anos) – preferir REFERÊNCIA c/ otorrino [p.99-100]';
    else if(lact) t='Antimoniato 20 mg Sb+5/kg/dia x 30 dias, sem pentoxifilina (lactante) – preferir REFERÊNCIA c/ otorrino [p.100]';
    else t='Antimoniato 20 mg Sb+5/kg/dia x 30 dias + pentoxifilina 400 mg 8/8h x 30 dias – preferir REFERÊNCIA c/ otorrino [p.99-100]';
  }
  else if(dis) t=(isNum(p.nles)&&p.nles>20)?'Anfotericina B lipossomal (>20 lesões) – REFERÊNCIA [p.95]':'Antimoniato 20 mg Sb+5/kg/dia x 30 dias – preferir REFERÊNCIA [p.95-96]';
  else if(p.guy===1) t=(dm||lact)?'Área L. guyanensis c/ pentamidina contraindicada: antimoniato (2ª escolha) [p.91]':'Pentamidina 4 mg/kg/dia, 3 doses (72/72h IM ou 48/48h EV), máx 300 mg/dose [p.91-92]'+intral;
  else t='Antimoniato 15 mg Sb+5/kg/dia (10-20) x 20 dias, EV ou IM [p.91-92]'+intral;
  r.trat=t;
  r.semForma=!p.forma;

  const a=[];
  if(isNum(p.evol)&&p.evol<3) a.push('Evolução <3 semanas: ainda não é caso suspeito de leishmaniose cutânea [p.112].');
  if(!p.hiv||p.hiv===3) a.push('HIV: oferecer sorologia a TODO paciente com leishmaniose [p.63].');
  if(!r.confirmado) a.push('Sem confirmação laboratorial: colher exame direto (escarificação da borda) antes de tratar, se possível [p.66-69, 164].');
  if(p.notif!==1) a.push('NOTIFICAR no SINAN todo caso confirmado [p.113].');
  if(gest) a.push('GESTANTE: antimoniato e pentamidina CONTRAINDICADOS [p.73, 83].');
  if(!gest&&p.sexo===2&&isNum(age)&&age>=10&&age<50&&!p.gest) a.push('Mulher em idade fértil: registrar se está gestante (antimoniato contraindicado na gestação) [p.73].');
  if(p.qt===1) a.push('Evitar drogas que prolongam QT; se usar antimoniato, ECG 2x/semana [p.73, 75].');
  if(p.audit===1) a.push('Antimoniato é ototóxico: considerar 5 mg Sb+5/kg/dia e audiometria [p.109-110].');
  if(muc||p.mucosa===2) a.push('Lesão mucosa: otorrino/centro de referência; se laringe/faringe, iniciar internado [p.73, 99].');
  if(p.mucosa!==1) a.push('Examinar mucosa nasal e oral (lesão inicial pode ser assintomática) [p.55].');
  if(dis) a.push('Disseminada: investigar HIV e mucosa (até 30% têm lesão mucosa) [p.47, 64].');
  if(lact) a.push('Lactante: antimoniato pode; pentamidina não; anfotericina lipossomal: suspender amamentação [p.80, 83, 101].');
  if(dm) a.push('Diabetes: pentamidina contraindicada [p.83].');
  if(isNum(age)&&age<1) a.push('<1 ano: pentamidina contraindicada [p.83].');
  if(isNum(age)&&age<12) a.push('<12 anos: pentoxifilina contraindicada [p.87, 99].');
  if(!isNum(p.peso)) a.push('Sem PESO: dose não calculada.');
  r.alertas=a;

  r.doseSug=t.startsWith('Antimoniato')?((muc||dis||dif)?20:15):null;
  r.dose=isNum(p.doseEsc)?p.doseEsc:r.doseSug;
  r.mg=(isNum(r.dose)&&isNum(p.peso))?Math.min(p.peso*r.dose,1215):null;
  r.ml=isNum(r.mg)?Math.round(r.mg/81*10)/10:null;
  r.amp=isNum(r.ml)?Math.round(r.ml/5*100)/100:null;
  r.dur=isNum(r.mg)?((muc||dis||dif)?30:20):null;
  r.totAmp=isNum(r.amp)?Math.ceil(r.amp*r.dur-1e-9):null;
  const ini=pd(p.inicio);
  r.fimPrev=(ini&&isNum(r.dur))?addD(ini,r.dur-1):null;
  r.fim=pd(p.fimReal)||r.fimPrev;

  // agenda
  const ag=[]; const E=r.fim, D=ini;
  if(D&&E){for(let k=1;k<=4;k++){const d=addD(D,7*k);if(d<=addD(E,1))ag.push({k:'Exames da '+k+'ª semana',d,ex:true});}}
  if(E){
    ag.push({k:'Retorno 1 mês após o fim',d:edate(E,1)});
    ag.push({k:'Retorno 2 meses após o fim',d:edate(E,2)});
    ag.push({k:'Retorno 3 meses após o fim (lesão fechou toda?)',d:edate(E,3)});
    if(hivPos) ag.push({k:'Retorno 4 meses (só HIV)',d:edate(E,4)});
    ag.push({k:'Retorno 5 meses após o fim',d:edate(E,5)});
    ag.push({k:'6 meses (180 dias) após o fim: sem crosta e sem infiltração?',d:addD(E,180)});
    ag.push({k:'Retorno 7 meses após o fim',d:edate(E,7)});
    ag.push({k:'Retorno 9 meses após o fim',d:edate(E,9)});
    ag.push({k:'Retorno 11 meses após o fim',d:edate(E,11)});
    ag.push({k:'12 meses após o fim: alta do seguimento',d:edate(E,12)});
  }
  r.agenda=ag;
  const enc=[4,5,9,8,10].includes(p.sit);
  const fut=ag.map(x=>x.d).filter(d=>d>=today()).sort((x,y)=>x-y);
  r.prox=enc?null:(fut[0]||null);
  return r;
}

function diaTrat(c,p,r){
  const A=pd(c.data); if(!A||!p) return '';
  const X=r.fim, Y=pd(p.inicio);
  if(X&&A>X) return diff(A,X)+' dias após o fim do tratamento';
  if(Y&&A>=Y) return 'dia '+(diff(A,Y)+1)+' do tratamento';
  return '';
}

function alertC(c,p,r){
  const a=[]; const A=pd(c.data), X=r?r.fim:null;
  const after=!!(X&&A&&A>X); const dd=after?diff(A,X):0;
  if(c.ausc===2||c.ecg===2) a.push('ARRITMIA/QT prolongado: avaliar suspensão e 2ª escolha; NOTIFICAR reação adversa grave [p.73-74].');
  if(c.ecg===3) a.push('Alteração de repolarização: efeito dose/tempo-dependente do antimonial, avaliar criteriosamente [p.73, 75].');
  if(c.ur===3) a.push('Creatinina Mais de 2x o normal: risco de insuficiência renal aguda (notificar); com anfotericina suspender 2-5 dias e retomar em dias alternados [p.74, 79, 82].');
  if(c.tgo===3) a.push('Transaminases Mais de 5x o normal/icterícia: reação GRAVE, NOTIFICAR e avaliar suspensão [p.74].');
  if(c.ami===3) a.push('Amilase/lipase Mais de 5x o normal: pancreatite? NOTIFICAR e avaliar suspensão [p.74].');
  if(c.aud===1) a.push('Ototoxicidade/vestibular do antimoniato: avaliar audiometria e redução de dose [p.109-110].');
  if((c.tipo===2||c.tipo===3)&&(!c.ecg||c.ecg===4)) a.push('ECG é SEMANAL durante o antimoniato [p.73, 75].');
  if(c.piora===1) a.push('Piora ou lesão nova após 1º esquema: indicar 2º esquema [p.105].');
  if(after&&dd>=90&&c.epit&&c.epit!==3) a.push('Sem epitelização completa em 90 dias: 2º esquema (forma localizada: repetir por 30 dias) [p.91, 105].');
  if(after&&dd<90&&c.epit&&c.epit!==3) a.push('Antes de 90 dias: observar se há melhora progressiva [p.105].');
  if(after&&c.epit===3&&c.crosta===1&&dd<180) a.push('Epitelizada com sinais residuais: observar sem novo tratamento até 180 dias se melhora progressiva [p.105].');
  if(after&&c.epit===3&&c.crosta===1&&dd>=180) a.push('Aos 180 dias ainda com crosta/infiltração/eritema: não preenche cura, reavaliar [p.105].');
  if(c.epit===3&&c.crosta===2) a.push('CRITÉRIO DE CURA (forma cutânea) atingido. Seguir de 2 em 2 meses até 12 meses após tratamento [p.105, 107].');
  return a;
}

  for(const [name,data] of files){const nb=enc.encode(name),db=typeof data==='string'?enc.encode(data):data,crc=crc32(db);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint32(14,crc,true);h.setUint32(18,db.length,true);h.setUint32(22,db.length,true);h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer),nb,db);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,db.length,true);c.setUint32(24,db.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);
    cent.push(new Uint8Array(c.buffer),nb);off+=30+nb.length+db.length;}
  const cs=cent.reduce((a,b)=>a+b.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  const all=[...parts,...cent,new Uint8Array(e.buffer)];const out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let p=0;for(const a of all){out.set(a,p);p+=a.length;}return out;}
const xesc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

/* --- leitura da planilha .xlsx --- */
async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('arquivo não é uma planilha .xlsx');const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};const dec=new TextDecoder();
  for(let k=0;k<n;k++){const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true);const data=u.subarray(lo+30+lnl+lxl,lo+30+lnl+lxl+csz);
    out[name]={meth,data};p+=46+nl+xl+cl;}
  return async name=>{const f=out[name];if(!f)return null;if(f.meth===0)return dec.decode(f.data);
    if(typeof DecompressionStream==='undefined')throw new Error('este navegador não lê planilhas; atualize o Chrome/Edge');
    const s=new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text();};}
function ddmmaa(v){if(v==null||v==='')return null;if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  const n=Math.round(+v);if(!isFinite(n)||n<=0)return null;const yy=new Date().getFullYear()%100;
  const tryD=(d,m,y)=>{const dt=new Date(y,m-1,d);return(dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d)?iso(dt):null;};
  let s=String(n);if(s.length<=6){s=s.padStart(6,'0');const y2=+s.slice(4,6);const r=tryD(+s.slice(0,2),+s.slice(2,4),y2>yy?1900+y2:2000+y2);if(r)return r;}
  else if(s.length<=8){s=s.padStart(8,'0');const r=tryD(+s.slice(0,2),+s.slice(2,4),+s.slice(4,8));if(r)return r;}
  if(n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));}return null;}
async function readPlanilha(buf){
  const get=await unzip(buf);const wb=await get('xl/workbook.xml'),rels=await get('xl/_rels/workbook.xml.rels');if(!wb)throw new Error('arquivo não é uma planilha .xlsx');
  const ss=[];const sst=await get('xl/sharedStrings.xml');const dp=new DOMParser();
  if(sst){dp.parseFromString(sst,'application/xml').querySelectorAll('si').forEach(si=>ss.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join('')));}
  const rd=dp.parseFromString(rels,'application/xml');const target={};rd.querySelectorAll('Relationship').forEach(r=>target[r.getAttribute('Id')]=r.getAttribute('Target'));
  const sheets={};dp.parseFromString(wb,'application/xml').querySelectorAll('sheet').forEach(s=>{const id=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let t=target[id]||'';t=t.replace(/^\/?xl\//,'');sheets[s.getAttribute('name')]='xl/'+t;});
  async function rows(name){const path=sheets[name];if(!path)throw new Error('a planilha não tem a aba '+name);const x=dp.parseFromString(await get(path),'application/xml');const out={};
    x.querySelectorAll('sheetData row').forEach(row=>{const rn=+row.getAttribute('r');if(rn<5)return;const o={};row.querySelectorAll('c').forEach(c=>{const ref=c.getAttribute('r').replace(/\d+/g,'');const t=c.getAttribute('t');const vEl=c.getElementsByTagName('v')[0];
      let v=null;if(t==='s'&&vEl)v=ss[+vEl.textContent];else if(t==='inlineStr'){v=Array.from(c.getElementsByTagName('t')).map(z=>z.textContent).join('');}else if(t==='str'||t==='e'){v=null;}else if(vEl){v=+vEl.textContent;}
      if(c.getElementsByTagName('f')[0]&&t!=='s'&&t!=='inlineStr'&&!['A','B'].includes(ref)){/* célula de fórmula: ignorar */ if(!isFinite(v))v=null;}
      if(v!==null&&v!=='')o[ref]=v;});out[rn]=o;});return out;}
  const pr=await rows('PACIENTES'),cr=await rows('CONSULTAS');const patients=[],consults=[];
  const conv=(cols,o)=>{const r={};cols.forEach(([c,k,t])=>{let v=o[c];if(v==null||v==='')return;if(t==='d')v=ddmmaa(v);else if(t==='n'||t==='o'){v=typeof v==='number'?v:parseFloat(String(v).replace(',','.'));if(!isFinite(v))return;}else v=String(v);if(v!=null)r[k]=v;});return r;};
  Object.values(pr).forEach(o=>{const p=conv(PCOL,o);if(isNum(p.id)&&p.id>0)patients.push(p);});
  Object.values(cr).forEach(o=>{const c=conv(CCOL,o);if(isNum(c.cod)&&c.cod>0&&(c.data||c.tipo)){c.uid=Date.now()+Math.random();consults.push(c);}});
  if(!patients.length)throw new Error('nenhum paciente encontrado na aba PACIENTES');
  return{patients,consults};
}

const DRIVE='https://drive.google.com/file/d/1sL20iZG8e9H0gDaMzCjFGqDdzSnt7s0k/view';
const KEY='protocoloLT.v1';
let S={patients:[],consults:[],sel:null,seeded:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pg=s=>esc(s).replace(/\[(p\.[^\]]+)\]/g,'<span class="pg">[$1]</span>');

function load(){try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t);S=Object.assign(S,d);}}catch(e){}
  if(!S.seeded&&!S.patients.length){seed();}
}
let saveT=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));flashSaved();}catch(e){toast('Não foi possível salvar neste navegador. Exporte um backup em Dados.');}}
function flashSaved(){const el=$('#saved');if(!el)return;el.classList.add('on');clearTimeout(saveT);saveT=setTimeout(()=>el.classList.remove('on'),1400);}
function seed(){
  const ex=CONTENT.ex;
  S.patients=[ex.p]; S.consults=[ex.c]; S.sel=999; S.seeded=true;
}
function P(id){return S.patients.find(p=>p.id===id)||null;}
function consultsOf(id){return S.consults.filter(c=>c.cod===id).sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(a.uid-b.uid));}
function lastC(id){const l=consultsOf(id);return l.length?l[l.length-1]:null;}
function realPatients(){return S.patients.filter(p=>p.id!==999);}
function status(p){const r=calc(p);const lc=lastC(p.id);const la=lc?alertC(lc,p,r):[];
  const red=r.encaminhar||r.alertas.some(a=>/CONTRAINDIC/i.test(a))||la.some(a=>/SUSPEN|NOTIFICAR/i.test(a));
  if(red)return{c:'r',t:'ATENÇÃO: ver alertas e encaminhamento'};
  if(r.alertas.length||la.length)return{c:'y',t:'Há alertas: leia abaixo'};
  return{c:'g',t:'Sem alertas do protocolo'};}
function toast(m){let t=$('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
async function copy(txt,btn){try{await navigator.clipboard.writeText(txt);toast('Copiado. Cole no PEC.');}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copiado. Cole no PEC.');}catch(_){toast('Selecione o texto e copie.');}ta.remove();}}

function fieldHTML(pre,obj,f,calcv){
  const [k,l,t,x,w]=f; const id=pre+'_'+k; const wide=(t==='o'?w:x)?' w':'';
  if(t==='c') return `<div class="f"><span class="lb">${l}</span><div class="calcv" id="${id}">${esc(calcv[k]||'—')}</div></div>`;
  if(t==='o') return `<div class="f${wide}"><span class="lb" id="${id}_l">${l}</span><div class="seg" role="group" aria-labelledby="${id}_l">${OPT[x].map((o,i)=>`<button type="button" data-k="${k}" data-v="${i+1}" aria-pressed="${obj[k]===i+1}">${o}</button>`).join('')}</div></div>`;
  const v=obj[k]==null?'':obj[k];
  if(t==='a') return `<div class="f${wide}"><label for="${id}">${l}</label><textarea id="${id}" data-k="${k}">${esc(v)}</textarea></div>`;
  const type=t==='d'?'date':t==='n'?'number':t==='tel'?'tel':'text';
  return `<div class="f${wide}"><label for="${id}">${l}</label><input id="${id}" data-k="${k}" type="${type}" ${t==='n'?'inputmode="decimal" step="any"':''} value="${esc(v)}"></div>`;
}
function formHTML(pre,obj,defs,calcv){return defs.map(s=>`<section class="sec"><h3>${s[0]}</h3><div class="fgrid">${s[1].map(f=>fieldHTML(pre,obj,f,calcv)).join('')}</div></section>`).join('');}
function bindForm(root,obj,defs,onchange){
  const types={};defs.forEach(s=>s[1].forEach(f=>types[f[0]]=f[2]));
  root.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=+b.dataset.v;obj[k]=obj[k]===v?null:v;
    b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',obj[k]===+x.dataset.v));onchange(k);});
  root.querySelectorAll('input[data-k],textarea[data-k]').forEach(i=>i.oninput=()=>{const k=i.dataset.k;let v=i.value;
    if(types[k]==='n'){v=v===''?null:parseFloat(String(v).replace(',','.'));if(!isFinite(v))v=null;}else if(v==='')v=null;obj[k]=v;onchange(k);});
}

    <div class="box ${r.alertas.length?'y':'g'}"><b class="lbl">Alertas</b>${alertList(r.alertas,'Sem alertas do protocolo para este cadastro.')}</div>`;}
  else{const I=avulso.idade;ctx={pac:false,peso:avulso.peso,idade:I,trat:''};
    const a=[isNum(I)&&I<1&&'Menor de 1 ano: pentamidina contraindicada [p.83].',isNum(I)&&I<12&&'Menor de 12 anos: pentoxifilina contraindicada [p.86].',isNum(I)&&I>=50&&'50 anos ou mais: preferir anfotericina B lipossomal em centro de referência [p.101].','Sem paciente escolhido, gestação e comorbidades NÃO estão sendo verificadas.'].filter(Boolean);

  return `<div><h1>Dose e tratamento</h1><p class="lead">Escolha o paciente: o aplicativo puxa peso, idade, gestação, comorbidades e forma clínica, marca de verde o tratamento indicado pelo manual e mostra contraindicações. Sem paciente, use o cálculo avulso.</p></div>
  <div class="seg noprint" role="group" aria-label="Modo"><button type="button" id="m1" aria-pressed="${avulso.modo==='pac'}">Paciente cadastrado</button><button type="button" id="m2" aria-pressed="${avulso.modo!=='pac'}">Cálculo avulso</button></div>
  ${avulso.modo==='pac'?picker('pk'):''}

  <p class="hint">Verde = indicado pelo manual para o paciente escolhido; verde-claro = opção ou associação; vermelho = contraindicado; amarelo = evitar. A decisão final é do médico ou preceptor.<br>Conferência com o manual (60 kg): 15 mg/kg = 900 mg = 11,1 mL ≈ 2 amp <span class="pg">[p.76]</span>; desoxicolato 0,7 mg/kg = 42 mg = 8,4 mL <span class="pg">[p.78]</span>; lipossomal 30 mg/kg = 1.800 mg = 36 frascos <span class="pg">[p.82]</span>; pentamidina 3 mg/kg = 180 mg = 0,6 frasco = 3 mL <span class="pg">[p.85]</span>.</p>`;};
AFTER.dose=()=>{bindPick();$('#m1').onclick=()=>{avulso.modo='pac';render();};$('#m2').onclick=()=>{avulso.modo='av';render();};
  const ap=$('#ap'),ai=$('#ai');const upd=()=>{avulso.peso=ap.value===''?null:parseFloat(ap.value.replace(',','.'));avulso.idade=ai.value===''?null:parseFloat(ai.value);const pos=document.activeElement&&document.activeElement.id;render();const el=$('#'+pos);if(el){el.focus();const v=el.value;el.value='';el.value=v;}};

function soapText(p){
  const r=calc(p),c=lastC(p.id);const ni=v=>(v==null||v==='')?'não informado':v;const low=s=>String(s).toLowerCase().replace(/qt /g,'QT ').replace(/hiv/g,'HIV');
  const S1=[],O=[],A=[],PL=[];const nf=v=>isNum(v)?String(v).replace('.',','):v;
  S1.push(`Paciente do sexo ${p.sexo===1?'masculino':p.sexo===2?'feminino':'não informado'}, ${isNum(r.idade)?r.idade+' anos':'idade não informada'}, ${low(ni(p.ocup))}, residente em ${ni(p.end)} – ${ni(p.cidade)}${p.zona?' (zona '+lab('zona',p.zona).toLowerCase()+').':'.'}`);
  if(!c||c.tipo===1) S1.push(`Refere lesão de pele há ${ni(p.evol)} semanas.`); else S1.push(`Em acompanhamento por leishmaniose tegumentar (${low(lab('tipo',c.tipo)||'')}${diaTrat(c,p,r)?', '+diaTrat(c,p,r):''}).`);
  S1.push('Queixas/evolução: '+ni(c&&c.queixas));
  S1.push('Exposição/deslocamentos nos 6 meses antes da lesão: '+ni(p.desloc));
  const cm=[p.comorb===1&&'cardiopatia/nefropatia/hepatopatia ou transplante',p.dm===1&&'diabetes ou intolerância à glicose',p.imuno===1&&'imunossupressão',p.qt===1&&'uso de medicação que prolonga o intervalo QT',p.audit===1&&'perda auditiva ou tontura prévia'].filter(Boolean);
  S1.push('Comorbidades: '+(cm.length?cm.join('; ')+'.':(p.comorb||p.dm||p.imuno||p.qt||p.audit)?'nega.':'não informado.'));
  S1.push('Sorologia HIV: '+low(lab('hiv',p.hiv)||'não informado')+'.');
  if(p.sexo===2) S1.push('Gestante: '+low(lab('gest',p.gest)||'não informado')+'. Amamentando: '+low(lab('sn',p.lact)||'não informado')+'.');
  if(c&&(c.outros||c.aud===1)) S1.push(((c.outros?'Efeitos adversos referidos: '+c.outros+'.':'')+(c.aud===1?' Refere queixa auditiva/tontura nova.':'')).trim());
  const peso=(c&&isNum(c.peso))?c.peso:p.peso;
  O.push(`Peso: ${isNum(peso)?nf(peso)+' kg':'não informado'}. PA: ${c&&c.pa?c.pa+' mmHg':'não informada'}. Ausculta cardíaca: ${low(lab('ausc',c&&c.ausc)||'não informado')}.`);
  const dm=(c&&isNum(c.diam))?c.diam:p.diam;
  O.push(`Lesão: forma ${low(lab('forma',p.forma)||'não informado')}, ${ni(p.nles)} lesão(ões), localização ${low(lab('local',p.local)||'não informado')}, maior diâmetro ${ni(nf(dm))} cm.`);
  if(c&&c.epit) O.push(`Epitelização: ${lab('epit',c.epit).toLowerCase()}. Crosta/descamação/infiltração/eritema: ${low(lab('sn',c.crosta)||'não informado')}. Piora ou lesão nova: ${low(lab('sn',c.piora)||'não informado')}.`);
  O.push(`Linfadenopatia/linfangite: ${low(lab('sn',p.linf)||'não informado')}. Mucosa nasal e oral: ${low(lab('mucosa',p.mucosa)||'não informado')}.`);
  O.push(`Exames diagnósticos: exame direto ${low(lab('exame',p.direto)||'não informado')}; intradermorreação de Montenegro ${low(lab('exame',p.idrm)||'não informado')}; histopatologia ${low(lab('histo',p.histo)||'não informado')}.`);
  if(c&&(c.ecg||c.ur||c.tgo||c.ami||c.hemo)) O.push(`Monitorização: ECG ${low(lab('ecg',c.ecg)||'não informado')}; ureia/creatinina ${low(lab('ur',c.ur)||'não informado')}; TGO/TGP/bilirrubinas ${low(lab('tgo',c.tgo)||'não informado')}; amilase/lipase ${low(lab('ami',c.ami)||'não informado')}; hemograma ${low(lab('hemo',c.hemo)||'não informado')}.`);
  A.push(`Leishmaniose tegumentar, forma ${low(lab('forma',p.forma)||'não informado')} (CID-10 ${p.forma===5?'B55.2':'B55.1'}). Critério de confirmação: ${r.criterio.replace(' [p.112]','').replace(' (só se sem acesso a exame)','').toLowerCase()}.`);
  A.push(`Momento do acompanhamento: ${c?low(lab('tipo',c.tipo)||'não informado')+(diaTrat(c,p,r)?' ('+diaTrat(c,p,r)+')':''):'não informado'}. Situação: ${low(lab('sit',p.sit)||'não informado')}.`);
  if(c){const A2=pd(c.data);if(c.epit===3&&c.crosta===2)A.push('Critério de cura clínica atingido (epitelização completa, sem crosta, descamação, infiltração ou eritema).');
    else if(r.fim&&A2&&diff(A2,r.fim)>=90&&c.epit&&c.epit!==3)A.push('Sem epitelização completa após 90 dias do término do tratamento: indicado 2º esquema.');
    if(c.ecg===2||c.ausc===2||c.tgo===3||c.ami===3||c.ur===3)A.push('Evento adverso grave ao tratamento em avaliação.');}
  if(!p.droga) PL.push('Tratamento: não iniciado ou não informado.');
  else{let t='Tratamento: '+((p.droga===1||p.droga===6)?`antimoniato de meglumina ${isNum(r.dose)?nf(r.dose):'—'} mg Sb+5/kg/dia = ${isNum(r.mg)?nf(r.mg):'—'} mg Sb+5/dia (${isNum(r.ml)?nf(r.ml):'—'} mL/dia), EV lenta ou IM, 1x/dia, por ${isNum(r.dur)?r.dur:'—'} dias`+(p.droga===6?'; pentoxifilina 400 mg VO 8/8h por 30 dias':''):lab('droga',p.droga).toLowerCase());
    if(p.inicio)t+='; início '+fd(p.inicio)+(r.fimPrev?', término previsto '+fd(r.fimPrev):'');PL.push(t+'.');}
  PL.push('Conduta: '+ni(c&&c.conduta));
  if(!c||c.tipo===1)PL.push('Solicitado: exame direto (escarificação da borda da lesão), sorologia para HIV e exames basais (ECG, hemograma, ureia, creatinina, amilase, lipase, TGO, TGP, bilirrubinas, GGT, fosfatase alcalina).');
  else if(c.tipo===2||c.tipo===3)PL.push('Solicitado: ECG, hemograma, ureia, creatinina, amilase, lipase, TGO, TGP, bilirrubinas e fosfatase alcalina semanais durante o tratamento.');
  PL.push((c&&(c.tipo===2||c.tipo===3))?'Orientações: repouso físico relativo e não ingerir bebida alcoólica durante o tratamento; limpeza da lesão com água e sabão; retornar antes se palpitação, desmaio, tontura, diminuição da audição ou piora da lesão.':'Orientações: limpeza da lesão com água e sabão; retornar se surgir lesão nova, piora da lesão ou sintomas nasais/orais.');
  PL.push('Notificação: '+(p.notif===1?'caso notificado no SINAN'+(p.dnotif?' em '+fd(p.dnotif):'')+(p.nsinan?', nº '+p.nsinan:'')+'.':'realizar notificação no SINAN (agravo de notificação compulsória).'));
  PL.push(r.encaminhar?'Encaminhamento ao centro de referência indicado (situação especial do protocolo).':'Acompanhamento na UBS.');
  PL.push('Retorno: '+(c&&c.retorno?fd(c.retorno):r.prox?fd(r.prox):'a agendar')+'.');
  return {S:S1.join('\n'),O:O.join('\n'),A:A.join('\n'),P:PL.join('\n'),c,r};
}
V.soap=()=>{const p=P(S.sel);
  if(!p) return `<h1>Texto SOAP</h1>${picker('pk')}<div class="panel empty">Escolha o paciente.</div>`;
  const t=soapText(p);const blk=(k,n)=>`<div class="sb"><header><b>${n}</b><button class="btn sm" data-copy="${k}">${ic('copy')}Copiar</button></header><pre id="s_${k}">${esc(t[k])}</pre></div>`;
  const ca=t.c?alertC(t.c,p,t.r):[];
  return `<div><h1>Texto SOAP para o PEC</h1><p class="lead">Junta o cadastro e a última consulta (${t.c?fd(t.c.data):'sem consulta registrada: usando só o cadastro'}). Copie cada bloco e cole no campo do PEC. Dado não preenchido aparece como “não informado”.</p></div>${picker('pk')}
  <div class="soap">${blk('S','S – Subjetivo')}${blk('O','O – Objetivo')}${blk('A','A – Avaliação')}${blk('P','P – Plano')}</div>

  <section class="panel"><h2>Para sua revisão (não colar no PEC)</h2>${alertList(ca.concat(t.r.alertas))}</section>`;};
AFTER.soap=()=>{bindPick();const p=P(S.sel);if(!p)return;const t=soapText(p);
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const k=b.dataset.copy;copy(k==='ALL'?`S – SUBJETIVO\n${t.S}\n\nO – OBJETIVO\n${t.O}\n\nA – AVALIAÇÃO\n${t.A}\n\nP – PLANO\n${t.P}`:t[k],b);});};

V.ficha=()=>{const p=P(S.sel);

  const ag=r.agenda;const cs=consultsOf(p.id).slice(0,10);
  return `<div class="noprint"><h1>Ficha do paciente</h1><p class="lead">Documento para imprimir ou salvar em PDF. No computador use o botão abaixo ou Ctrl+P e escolha “Salvar como PDF”. No celular, use Compartilhar › Imprimir.</p></div>

  <h4>2. Lesão</h4><div class="g">${g('Forma clínica',lab('forma',p.forma))}${g('Nº de lesões',p.nles)}${g('Maior diâmetro (cm)',p.diam)}${g('Localização',lab('local',p.local))}${g('Evolução (semanas)',p.evol)}${g('Linfadenopatia',lab('sn',p.linf))}${g('Mucosa',lab('mucosa',p.mucosa))}${g('Área de L. guyanensis',lab('sn',p.guy))}</div>
  <h4>3. Comorbidades e situações especiais</h4><div class="g">${g('Cardio/nefro/hepato/transpl.',lab('sn',p.comorb))}${g('Diabetes',lab('sn',p.dm))}${g('HIV',lab('hiv',p.hiv))}${g('Imunossupressão',lab('sn',p.imuno))}${g('Droga que prolonga QT',lab('sn',p.qt))}${g('Perda auditiva/tontura',lab('sn',p.audit))}</div>
  <h4>4. Diagnóstico e notificação</h4><div class="g">${g('Exame direto',lab('exame',p.direto))}${g('Montenegro',lab('exame',p.idrm))}${g('Histopatologia',lab('histo',p.histo))}${g('Notificado SINAN',lab('sn',p.notif))}${g('Data notificação',fd(p.dnotif))}${g('Nº SINAN',esc(p.nsinan))}${g('Critério de confirmação',esc(r.criterio),1)}</div>

  <h4>8. Situação</h4><div class="g">${g('Situação',lab('sit',p.sit))}${g('Encerramento',fd(p.dEnc))}${g('Observações',esc(p.obs),1)}</div>

V.protocolo=()=>`<div><h1>Protocolo resumido</h1><p class="lead">O que o manual diz, com a página.</p></div><input class="search" id="q" type="search" placeholder="Buscar no protocolo" aria-label="Buscar no protocolo">
  <div class="card-k" id="pl">${CONTENT.protocolo.map(r=>`<div data-t="${esc((r[0]+' '+r[1]).toLowerCase())}"><b>${esc(r[0])}</b><span>${esc(r[1])} <span class="pg">[${esc(r[2])}]</span></span></div>`).join('')}</div>`;
AFTER.protocolo=()=>{$('#q').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#pl>div').forEach(d=>d.hidden=q&&!d.dataset.t.includes(q));};};
V.legenda=()=>{const g={};CONTENT.legenda.forEach(r=>{const k=r[0]+'|'+r[1];(g[k]=g[k]||[]).push(r);});
  return `<div><h1>Legenda dos códigos</h1><p class="lead">No aplicativo você toca na opção por extenso, mas cada resposta é guardada como número, igual à planilha. Isso facilita a estatística depois (exportar para Excel, SPSS ou R).</p></div>
  <div class="tw"><table><thead><tr><th>Aba</th><th>Campo</th><th>Códigos</th></tr></thead><tbody>${Object.values(g).map(rs=>`<tr><td>${esc(rs[0][0])}</td><td>${esc(rs[0][1])}</td><td>${rs.map(r=>`<b class="num">${esc(r[2])}</b> = ${esc(r[3])}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>`;};
V.referencias=()=>`<div><h1>Referências</h1></div><div class="card-k">${CONTENT.referencias.slice(0,3).map(r=>`<div><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div>
  <h2>Onde está no manual</h2><div class="tw"><table><thead><tr><th>Assunto</th><th>Página(s)</th></tr></thead><tbody>${CONTENT.referencias.slice(4).filter(r=>r[2]&&r[0]!=='Assunto').map(r=>`<tr><td>${esc(r[0])}</td><td class="d">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
  <p class="hint">Versão do aplicativo 1.0 · novembro de 2026 · mesmas regras da planilha LT-Protocolo-Digital-Santos-2026.</p>`;
V.ajuda=()=>`<div><h1>Como usar</h1><p class="lead">O aplicativo faz o mesmo que a planilha, com botões no lugar dos números.</p></div>
  <section class="panel"><h2>Vídeo tutorial</h2><p style="margin:0 0 10px">O vídeo mostra o protocolo passo a passo, na versão planilha. As telas do aplicativo seguem a mesma lógica.</p><a class="btn pri" href="${DRIVE}" target="_blank" rel="noopener">${ic('play')}Assistir ao tutorial (abre no navegador)</a></section>
  <section class="panel prose"><h2>Passo a passo com paciente novo</h2>
   <p><b>1. Pacientes › Novo paciente.</b> O código (LT-001, LT-002…) sai sozinho. Preencha o cadastro uma vez. O quadro “Resultado do protocolo” mostra tratamento, dose, encaminhamento e alertas na hora.</p>
   <p><b>2. Consultas › Nova consulta</b> a cada atendimento. O quadro “Alerta do manual” avisa quando suspender, notificar reação, indicar 2º esquema ou dar critério de cura.</p>
   <p><b>3. Texto SOAP:</b> copie cada bloco e cole no PEC.</p>
   <p><b>4. Ficha (PDF):</b> imprima ou salve em PDF para referência, preceptor ou vigilância.</p>
   <p><b>5. Agenda:</b> exames semanais durante o tratamento e retornos até a alta, calculados sozinhos.</p></section>
  <section class="panel prose"><h2>Instalar como aplicativo</h2>
   <p><b>Celular Android (Chrome):</b> abra o link, toque nos três pontinhos › “Adicionar à tela inicial” ou “Instalar app”.</p>
   <p><b>iPhone (Safari):</b> toque em Compartilhar › “Adicionar à Tela de Início”.</p>
   <p><b>Notebook (Chrome ou Edge):</b> clique no ícone de instalar na barra de endereço, ou menu › “Instalar Protocolo LT”.</p>
   <p>Depois de instalado, abre pelo ícone e funciona sem internet.</p></section>
  <section class="panel prose"><h2>Privacidade (LGPD)</h2>
   <p>Os dados ficam só no aparelho em que foram digitados. Nada é enviado para servidor. Cada médico tem os próprios pacientes no próprio celular ou notebook.</p>
   <p>Por isso, faça backup em <a href="#dados">Dados e backup</a> de vez em quando. Para levar os dados do celular para o notebook, exporte o backup em um e importe no outro.</p>
   <p>Para mandar informação a alguém, envie só a ficha em PDF daquele paciente e só para quem cuida dele. CPF e nome da mãe não são necessários aqui.</p></section>
  <section class="panel prose"><h2>Aviso</h2><p>${esc(CONTENT.aviso)}</p></section>`;

V.dados=()=>{const n=realPatients().length;let used='';try{used=Math.round((localStorage.getItem(KEY)||'').length/1024)+' KB';}catch(e){}
  return `<div><h1>Dados e backup</h1><p class="lead">${n} paciente(s) e ${S.consults.filter(c=>c.cod!==999).length} consulta(s) guardados neste aparelho${used?' ('+used+')':''}.</p></div>
  ${window.LT_SW?'':'<div class="box y"><b class="lbl">Versão de teste</b>Nesta página de teste, baixar e importar arquivos e imprimir não funcionam. No aplicativo instalado e no arquivo do notebook funcionam.</div>'}
  <section class="panel prose"><h2>Exportar para Excel</h2><p>Gera um arquivo .xlsx com as abas PACIENTES e CONSULTAS, com as respostas em número (para estatística) e por extenso.</p><div class="row"><button class="btn pri" id="xl">${ic('down')}Baixar Excel</button></div></section>
  <section class="panel prose"><h2>Backup</h2><p>Salve o backup no Drive ou mande para você mesmo. Para passar os dados para outro aparelho, importe este arquivo lá.</p><div class="row"><button class="btn" id="bk">${ic('down')}Baixar backup</button><label class="btn" for="imp">${ic('up')}Importar backup</label><input id="imp" type="file" accept=".json,application/json" hidden></div></section>
  <section class="panel prose"><h2>Trazer pacientes da planilha</h2><p>Escolha o arquivo LT-Protocolo-Digital-Santos-2026.xlsx. Os pacientes e consultas das abas PACIENTES e CONSULTAS são copiados para este aparelho. A planilha não é alterada.</p><div class="row"><label class="btn" for="ixl">${ic('up')}Escolher planilha</label><input id="ixl" type="file" accept=".xlsx,.xlsm" hidden></div><div id="ixlr"></div></section>
  <section class="panel prose"><h2>Paciente exemplo</h2><p>LT-999 é fictício e serve para treinar.</p><div class="row">${P(999)?'<button class="btn danger sm" id="dex">Apagar LT-999</button>':'<button class="btn sm" id="rex">Recolocar LT-999</button>'}</div></section>`;};
AFTER.dados=()=>{
  $('#xl').onclick=()=>{try{download('Protocolo-LT-'+iso(today())+'.xlsx',buildXlsx(),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');}catch(e){toast('Não foi possível gerar o Excel: '+e.message);}};
  $('#bk').onclick=()=>download('Protocolo-LT-backup-'+iso(today())+'.json',new TextEncoder().encode(JSON.stringify({app:'Protocolo LT',v:1,patients:S.patients,consults:S.consults},null,1)),'application/json');
  $('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.patients))throw new Error('arquivo não é backup do Protocolo LT');const r=merge(d.patients,d.consults||[]);save();toast(`Importado: ${r.np} paciente(s), ${r.nc} consulta(s).`);render();}catch(err){toast('Backup inválido: '+err.message);}};
  $('#ixl').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#ixlr').innerHTML='<p class="hint">Lendo a planilha…</p>';try{const d=await readPlanilha(await f.arrayBuffer());const r=merge(d.patients,d.consults);save();$('#ixlr').innerHTML=`<div class="box g"><b class="lbl">Pronto</b>${r.np} paciente(s) e ${r.nc} consulta(s) copiados para este aparelho.</div>`;}catch(err){$('#ixlr').innerHTML=`<div class="box r"><b class="lbl">Não deu certo</b>${esc(err.message)}</div>`;}};
  const dx=$('#dex');if(dx)dx.onclick=()=>{S.patients=S.patients.filter(p=>p.id!==999);S.consults=S.consults.filter(c=>c.cod!==999);if(S.sel===999)S.sel=null;save();render();};
  const rx=$('#rex');if(rx)rx.onclick=()=>{S.patients.push(JSON.parse(JSON.stringify(CONTENT.ex.p)));S.consults.push(JSON.parse(JSON.stringify(CONTENT.ex.c)));save();render();};
};
function merge(ps,cs){let np=0,nc=0;ps.forEach(p=>{if(!isNum(p.id))return;const i=S.patients.findIndex(x=>x.id===p.id);if(i>=0)S.patients[i]=p;else S.patients.push(p);np++;});
  cs.forEach(c=>{if(!isNum(c.cod))return;const dup=S.consults.find(x=>x.cod===c.cod&&x.data===c.data&&x.tipo===c.tipo&&(x.conduta||'')===(c.conduta||''));if(dup)return;c.uid=c.uid||Date.now()+Math.random();S.consults.push(c);nc++;});return{np,nc};}
function download(name,bytes,type){const b=new Blob([bytes],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo '+name+' gerado.');}

V.mais=()=>`<h1>Mais</h1>${NAV.map(g=>`<section class="panel" style="padding:6px 12px"><div class="hint" style="padding:8px 4px 2px;text-transform:uppercase;letter-spacing:.08em">${g[0]}</div><div class="list">${g[1].map(x=>`<a class="item" href="#${x[0]}" style="text-decoration:none;color:inherit;grid-template-columns:auto 1fr">${ic(x[2])}<span class="nm">${x[1]}</span></a>`).join('')}</div></section>`).join('')}`;

/* ---------- início ---------- */
function boot(){load();shell();window.addEventListener('hashchange',()=>{editC=editC;render();});render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  try{if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&window.LT_SW)navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
}


boot();
</script>
</body></html>
