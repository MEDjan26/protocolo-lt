<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Protocolo Leishmaniose Tegumentar</title>
<meta name="description" content="Protocolo digital de leishmaniose tegumentar – apoio ao atendimento na Atenção Primária (MS 2017).">
<meta name="theme-color" content="#062F38">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Protocolo Leishmaniose Tegumentar">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: app shell — barra lateral no notebook, barra inferior no celular; cartões só onde há decisão clínica */
:root{
  --bg:#F2F6F6; --surface:#FFFFFF; --surface2:#E7EFEF; --line:#CFDCDC;
  --fg:#10282C; --muted:#4F6669; --teal:#0E5A6B; --teal-ink:#0B4A58; --teal-soft:#D6EBEE;
  --gold:#B8901A; --gold-soft:#F6ECC8;
  --ok:#1E7A46; --ok-soft:#DDF1E4; --warn:#9A6A00; --warn-soft:#FBF0CF; --bad:#B3261E; --bad-soft:#FBE1DE;
  --head:#062F38; --head-fg:#F4FAFB;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A171A; --surface:#122428; --surface2:#183035; --line:#26444A;
  --fg:#E4F0F1; --muted:#9DB5B8; --teal:#5FB8C8; --teal-ink:#8FD3DF; --teal-soft:#16363D;
  --gold:#E2BE55; --gold-soft:#3A3115;
  --ok:#6BCB8F; --ok-soft:#173A26; --warn:#E8BE4F; --warn-soft:#3B3014; --bad:#FF8A80; --bad-soft:#44201D;
  --head:#04191E; --head-fg:#F4FAFB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A171A; --surface:#122428; --surface2:#183035; --line:#26444A;
  --fg:#E4F0F1; --muted:#9DB5B8; --teal:#5FB8C8; --teal-ink:#8FD3DF; --teal-soft:#16363D;
  --gold:#E2BE55; --gold-soft:#3A3115;
  --ok:#6BCB8F; --ok-soft:#173A26; --warn:#E8BE4F; --warn-soft:#3B3014; --bad:#FF8A80; --bad-soft:#44201D;
  --head:#04191E; --head-fg:#F4FAFB; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal-ink)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:1.45rem} h2{font-size:1.15rem} h3{font-size:1rem}
.num{font-variant-numeric:tabular-nums}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-fg);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:12px}
.top img{width:36px;height:36px;border-radius:9px}
.brand{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand b{font-family:var(--font-d);font-size:1.02rem;letter-spacing:.02em}
.brand span{font-size:.72rem;color:#9FC6CD;letter-spacing:.06em;text-transform:uppercase}
.top .sp{flex:1}
.saved{font-size:.75rem;color:#BFE3C9;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.pchip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:.8rem;
  max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:var(--head-fg)}

/* estrutura */
.shell{display:flex;min-height:calc(100% - 52px)}
.side{display:none}
main{flex:1;min-width:0;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;text-decoration:none;color:var(--muted);font-size:.7rem;font-weight:600}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:var(--teal-ink)}
.tabs a.on svg{stroke:var(--teal-ink)}
@media (min-width:900px){
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:2px;width:236px;flex:none;padding:16px 10px;border-right:1px solid var(--line);background:var(--surface);
    position:sticky;top:calc(52px + env(safe-area-inset-top,0px));height:calc(100vh - 52px - env(safe-area-inset-top,0px));overflow:auto}
  .side .grp{font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
  .side a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:.92rem}
  .side a svg{width:18px;height:18px;flex:none;stroke:var(--muted)}
  .side a:hover{background:var(--surface2)}
  .side a.on{background:var(--teal-soft);color:var(--teal-ink);font-weight:600}
  .side a.on svg{stroke:var(--teal-ink)}
  main{padding-bottom:40px}
}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* blocos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel>h2{margin-bottom:10px}
.lead{color:var(--muted);margin:4px 0 0;max-width:68ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:1100px){.split{grid-template-columns:minmax(0,1fr) 360px}.split .stick{position:sticky;top:76px;align-self:start}}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;
  cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);min-height:42px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#04191E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#04191E}}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.85rem}
.btn svg{width:18px;height:18px}

/* hero */
.hero{background:var(--head);color:var(--head-fg);border-radius:14px;padding:22px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -60px -90px auto;width:260px;height:260px;border-radius:50%;border:16px solid rgba(201,162,39,.18)}
.hero img{width:84px;height:84px;border-radius:20px;flex:none}
.hero .t{min-width:0;flex:1 1 260px;position:relative;z-index:1}
.hero .eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#F2D16B}
.hero h1{font-size:1.6rem;margin:4px 0}
.hero p{margin:0;color:#BFDCE1;font-size:.9rem}

/* percurso */
.path{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.path{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1000px){.path{grid-template-columns:repeat(6,1fr)}}
.step{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:8px;background:var(--surface2);text-decoration:none;color:var(--fg);border:1px solid transparent}
.step:hover{border-color:var(--teal)}
.step b{font-size:.9rem}
.step small{color:var(--muted);font-size:.78rem}
.step .n{font-family:var(--mono);font-size:.72rem;color:var(--gold)}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:12px;border-radius:8px;background:var(--surface2)}
.stat b{display:block;font-size:1.7rem;font-family:var(--font-d);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.bad b{color:var(--bad)}

/* lista */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:hover{background:var(--surface2)}
.item .code{font-family:var(--mono);font-size:.82rem;color:var(--muted)}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{grid-column:2/4;font-size:.8rem;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--ok)} .dot.y{background:var(--warn)} .dot.r{background:var(--bad)}
.pill{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.t{background:var(--teal-soft);color:var(--teal-ink)}
.pill.r{background:var(--bad-soft);color:var(--bad)}
.pill.y{background:var(--warn-soft);color:var(--warn)}
.pill.g{background:var(--ok-soft);color:var(--ok)}
.pill.ex{background:var(--gold-soft);color:var(--gold)}

/* formulário */
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h3,.sech>h3{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);padding-top:6px;border-top:1px solid var(--line);padding-top:14px}
.sec:first-child>h3{border-top:0;padding-top:0}
.fgrid{display:grid;grid-template-columns:1fr;gap:12px 14px}
@media (min-width:620px){.fgrid{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.w{grid-column:1/-1}
.f>label,.f>.lb{font-size:.83rem;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;min-height:42px}
.f textarea{min-height:70px;resize:vertical}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px var(--teal-soft)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.86rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#04191E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#04191E}}
.hint{font-size:.78rem;color:var(--muted)}
.calcv{padding:9px 11px;border-radius:8px;background:var(--surface2);min-height:42px;display:flex;align-items:center;font-variant-numeric:tabular-nums}

/* resultado clínico */
.res{display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:minmax(110px,40%) minmax(0,1fr);gap:4px 12px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.box{border-radius:8px;padding:10px 12px;font-size:.9rem;border:1px solid transparent}
.box.t{background:var(--teal-soft);border-color:color-mix(in srgb,var(--teal) 30%,transparent)}
.box.r{background:var(--bad-soft);color:var(--fg);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.box.y{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.box.g{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.box b.lbl{display:block;font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
.box.r b.lbl{color:var(--bad)} .box.y b.lbl{color:var(--warn)} .box.g b.lbl{color:var(--ok)} .box.t b.lbl{color:var(--teal-ink)}
ul.al{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pg{font-family:var(--mono);font-size:.78em;color:var(--teal-ink);white-space:nowrap}

/* calculadora */
.rx{display:flex;flex-direction:column;gap:10px}
.rxi{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:1fr;gap:6px;background:var(--surface)}
.rxi.ind{border-color:var(--ok);box-shadow:inset 4px 0 0 var(--ok)}
.rxi.opt{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.rxi.ci{box-shadow:inset 4px 0 0 var(--bad)}
.rxi h3{font-size:.98rem}
.rxn{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem}
.rxn span b{font-variant-numeric:tabular-nums}
.rxi p{margin:0;font-size:.82rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}

/* SOAP */
.soap{display:flex;flex-direction:column;gap:12px}
.sb{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.sb header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--surface2)}
.sb header b{font-family:var(--font-d)}
.sb pre{margin:0;padding:12px;white-space:pre-wrap;font:14px/1.55 var(--font);overflow-wrap:anywhere}

/* tabelas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-size:.76rem;letter-spacing:.04em;color:var(--muted);font-weight:700;position:sticky;top:0}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums}
tr.soon td{background:var(--warn-soft)}
.past{color:var(--muted);text-decoration:line-through}

/* texto */
.prose{max-width:72ch;display:flex;flex-direction:column;gap:10px}
.prose p{margin:0}
.card-k{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.card-k>div{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line)}
@media (min-width:700px){.card-k>div{grid-template-columns:170px minmax(0,1fr);gap:16px}}
.card-k b{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-ink)}
.card-k span{white-space:pre-line;font-size:.92rem}
.card-k>div.al b{color:var(--bad)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px}
.empty{padding:24px 12px;text-align:center;color:var(--muted)}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--bad-soft)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--head);color:var(--head-fg);
  padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:24px}}
.ftr{font-size:.78rem;color:var(--muted);text-align:center;padding:8px 0}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.picker select{flex:1 1 220px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-width:0}

/* ficha impressa */
.ficha{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r);padding:20px;font-size:12.5px}
.ficha h2{font-size:15px;text-align:center;margin-bottom:4px;color:#111}
.ficha .fh{display:flex;align-items:center;gap:12px;border-bottom:2px solid #0E5A6B;padding-bottom:8px;margin-bottom:10px}
.ficha .fh img{width:48px;height:48px}
.ficha h4{margin:12px 0 4px;font-size:12px;background:#E6F0F2;color:#0B4A58;padding:4px 6px;letter-spacing:.05em;text-transform:uppercase}
.ficha .g{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.ficha .g div{border-bottom:1px dotted #bbb;padding:2px 0;display:flex;gap:6px}
.ficha .g div i{font-style:normal;color:#555;flex:none}
.ficha .w1{grid-column:1/-1}
.ficha table{font-size:11px} .ficha th{background:#E6F0F2;color:#333;position:static} .ficha th,.ficha td{border:1px solid #ccc;padding:3px 5px}
.ficha .sig{margin-top:22px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.ficha .sig span{border-top:1px solid #333;padding-top:3px;min-width:220px;text-align:center;font-size:11px}
.ficha .ft{font-size:10px;color:#555;margin-top:12px}
@media (max-width:560px){.ficha .g{grid-template-columns:1fr}}

@media print{
  body{background:#fff} body::before{display:none}
  .top,.side,.tabs,.noprint,.toast{display:none!important}
  main{padding:0!important} .wrap{max-width:none}
  .ficha{border:0;padding:0}
  .printable{display:block!important}
  .card-k{border:0} .card-k>div{grid-template-columns:150px 1fr;break-inside:avoid;padding:6px 0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.brand b{white-space:nowrap}
@media (max-width:440px){.brand span{display:none}.top img{width:32px;height:32px}}

/* tutorial em destaque */
.ttop{display:inline-flex;align-items:center;gap:6px;background:#C9A227;color:#1B1503;border:0;border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-size:.82rem;cursor:pointer;min-height:34px}
.ttop svg{width:20px;height:20px;stroke:#1B1503}
.ttop:hover{filter:brightness(1.08)}
@media (max-width:440px){.ttop span{display:none}.ttop{padding:6px}}
.tut{background:var(--head);color:var(--head-fg);border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr;gap:16px;align-items:center;border:2px solid #C9A227}
@media (min-width:900px){.tut{grid-template-columns:minmax(0,5fr) minmax(0,7fr);padding:22px}}
.tut-h{display:flex;flex-direction:column;gap:8px;min-width:0}
.tut-h h2{font-size:1.35rem;color:#fff}
.tut-h p{margin:0;color:#BFDCE1;font-size:.92rem;max-width:52ch}
.tag{align-self:flex-start;display:inline-block;background:#C9A227;color:#1B1503;font-weight:800;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.vid{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9;max-width:100%;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.vid video{width:100%;height:100%;display:block;background:#000}
.vplay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(4,25,30,.35);border:0;cursor:pointer;color:#fff}
.vplay:hover .vbtn{transform:scale(1.06)}
.vbtn{width:84px;height:84px;border-radius:50%;background:#C9A227;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px rgba(201,162,39,.3);transition:transform .15s}
.vbtn svg{width:46px;height:46px;stroke:#1B1503;fill:#1B1503;margin-left:4px}
.vbtn svg circle{display:none}
.vtxt{display:flex;flex-direction:column;align-items:center;background:rgba(4,25,30,.75);padding:6px 14px;border-radius:8px}
.vtxt b{font-size:1.05rem} .vtxt small{font-size:.78rem;color:#cfe6ea}
@media (max-width:480px){.vbtn{width:64px;height:64px}.vbtn svg{width:34px;height:34px}}
.vfall{display:none;margin:6px 0 0;color:inherit}.vfall.on{display:block}
.tut .vfall a{color:#F2D16B}
.go{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:760px){.go{grid-template-columns:repeat(4,1fr)}}
.gostep{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);text-decoration:none;color:var(--fg);cursor:pointer;text-align:left;font:inherit}
.gostep:hover{border-color:var(--teal)}
.gostep svg{width:26px;height:26px;stroke:var(--teal-ink)}
.gostep b{font-size:.95rem} .gostep small{color:var(--muted);font-size:.8rem}
.gn{position:absolute;top:10px;right:12px;font-family:var(--mono);font-size:.78rem;color:var(--gold);font-weight:700}
.path.two{grid-template-columns:repeat(2,1fr)!important}
@media (min-width:640px){.path.two{grid-template-columns:repeat(3,1fr)!important}}
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,14,17,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--fg);border-radius:14px;padding:18px;width:min(860px,100%);max-height:100%;overflow:auto;border:2px solid #C9A227}
.vbtn svg{width:40px;height:40px;fill:#1B1503;stroke:none;margin-left:6px}
@media (max-width:480px){.vbtn svg{width:30px;height:30px}}
@media (max-width:600px){
  .hero{padding:14px 16px;gap:12px;flex-wrap:nowrap;align-items:flex-start}
  .hero img{width:52px;height:52px;border-radius:12px}
  .hero h1{font-size:1.15rem}
  .hero p{font-size:.8rem}
  .hero::after{display:none}
  .tut{padding:14px}
  .tut-h h2{font-size:1.15rem}
  .pchip{max-width:32vw}
}
@media (max-width:440px){.ttop span{display:inline}.ttop{padding:6px 10px 6px 6px}}
@media (max-width:360px){.ttop span{display:none}}
.sheet .row:first-child{flex-wrap:nowrap}
/* automações e atalhos */
[hidden]{display:none!important}
.sech{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.sec:first-child .sech{border-top:0;padding-top:0}
.sech>h3{border:0!important;padding:0!important;margin:0}
.qrow{display:flex;gap:6px;flex-wrap:wrap}
.btn.quick{border-color:var(--teal);color:var(--teal-ink);background:var(--teal-soft);font-weight:600}
.btn.pri.quick{background:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.pri.quick{color:#04191E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri.quick{color:#04191E}}
.prog{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:thin}
.prog a{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);text-decoration:none;color:var(--fg);font-size:.84rem;font-weight:600}
.prog .pn{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);font-size:.74rem}
.prog small{color:var(--muted);font-weight:500;font-family:var(--mono);font-size:.72rem}
.prog a.mid .pn{background:var(--gold-soft);color:var(--gold)}
.prog a.ok{border-color:var(--teal);background:var(--teal-soft);color:var(--teal-ink)}
.prog a.ok .pn{background:var(--teal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px dashed var(--teal);background:transparent;color:var(--teal-ink);border-radius:999px;padding:5px 11px;font-size:.82rem;cursor:pointer;min-height:32px}
.chip:hover{background:var(--teal-soft)}
.chip:active{transform:scale(.97)}
.fabres{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:11px 16px;background:var(--head,#062F38);color:#fff;font-weight:700;font-size:.88rem;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.fabres svg{width:18px;height:18px;stroke:#fff}
@media (min-width:900px){.fabres{bottom:22px}}
@media (min-width:1100px){.fabres{display:none}}
@media print{.fabres,.prog,.chips{display:none!important}}
.saved1{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:600px){.top .saved{display:none}}
@media (max-width:480px){.top{gap:8px}.brand{flex:none}.brand b{white-space:nowrap}.brand span{display:none}.pchip{max-width:28vw;min-width:0}.ttop{flex:none}}

.tinst{display:inline-flex;align-items:center;gap:6px;background:#1F9D6B;color:#fff;border:0;border-radius:999px;padding:6px 12px 6px 8px;font-weight:700;font-size:.82rem;cursor:pointer;min-height:34px}
.tinst svg{width:20px;height:20px;stroke:#fff}
.tinst:hover{filter:brightness(1.08)}
.tinst[hidden],.instb[hidden]{display:none!important}
.instb{background:#1F9D6B!important;color:#fff!important;border-color:#1F9D6B!important}
.instb svg{stroke:#fff}
@media (max-width:480px){.tinst span{display:none}.tinst{padding:6px;flex:none}}

 bordas elevadas e firmes, fundo granuloso avermelhado [p.41-42]. SEMPRE examinar a mucosa [p.54-55]."], ["DIAGNÓSTICO", "Exame direto (escarificação da borda) é a 1ª escolha. Montenegro pode ser negativa nas primeiras 4-6 semanas. Exames negativos → centro de referência [p.66-69, 164]. Oferecer sorologia HIV a TODOS [p.63]."], ["NOTIFICAR", "Todo caso confirmado no SINAN (ficha do Anexo J) [p.113]."], ["1ª ESCOLHA", "Cutânea localizada: antimoniato de meglumina 15 mg Sb+5/kg/dia (10-20), EV ou IM, por 20 dias [p.91-92].\nÁrea de L. guyanensis: pentamidina 4 mg/kg/dia, 3 doses (72/72 h IM ou 48/48 h EV), máx. 300 mg/dose [p.91-92].\nLesão única ≤3 cm, fora de cabeça e região periarticular, sem imunossupressão: antimoniato intralesional, 1 a 3 sessões a cada 15 dias, só profissional capacitado [p.90, 93-94].\nDisseminada: antimoniato 20 mg/kg/dia por 30 dias, de preferência no centro de referência [p.95-96]. Difusa: pentamidina 4 mg/kg em dias alternados, 10 doses, no centro de referência [p.97-98].\nMucosa: antimoniato 20 mg/kg/dia por 30 dias + pentoxifilina 400 mg 8/8 h por 30 dias (acima de 12 anos), com otorrino no centro de referência [p.99-100]."], ["CONTA DO ANTIMONIATO", "Ampola 5 mL = 405 mg Sb+5 (81 mg/mL). Dose (mg) = peso × mg/kg. Volume (mL) = mg ÷ 81. MÁXIMO 1.215 mg/dia = 3 ampolas = 15 mL [p.74, 91-92].\nExemplo do manual: 60 kg × 15 mg/kg = 900 mg = 11,1 mL ≈ 2 ampolas [p.76]."], ["ENCAMINHAR", "Centro de referência (anfotericina B lipossomal ou desoxicolato): gestante, 50 anos ou mais, cardiopatia, nefropatia, hepatopatia, transplantado, HIV/imunossupressão, forma mucosa, disseminada ou difusa, falha terapêutica [p.101-104].\nAcre: SAE Rio Branco, (68) 3223-8571 / 3223-8353 (dados de 2017, confirmar) [p.179]."], ["CONTRAINDICAÇÕES", "Antimoniato: gestação; evitar em 50 anos ou mais e em cardio/nefro/hepatopatas [p.73, 75]. Pentamidina: gestação, lactação, menor de 1 ano, diabetes, doença renal, hepática ou cardíaca [p.83]. Pentoxifilina: menor de 12 anos, gestante, lactante, HIV/imunossupressão [p.86-87]."], ["MONITORAR", "Durante o antimoniato: ECG, hemograma, ureia/creatinina, amilase/lipase, TGO/TGP/bilirrubinas SEMANAIS; ausculta cardíaca; repouso relativo e sem álcool [p.73-75]. Ototóxico: atenção a zumbido e perda auditiva [p.75]."], ["ALARME: SUSPENDER E NOTIFICAR", "Arritmia ou QT prolongado, insuficiência renal aguda, icterícia ou transaminases acima de 5x o normal, pancreatite ou amilase/lipase acima de 5x o normal, óbito. NA DÚVIDA, NOTIFIQUE [p.73-74]."], ["CURA E SEGUIMENTO", "Cura cutânea: epitelização completa até 90 dias e sem crosta, descamação, infiltração ou eritema até 180 dias [p.105]. Sem epitelização em 90 dias, piora ou lesão nova: 2º esquema [p.105].\nRetornos: mensais por 3 meses após o fim (HIV: 6 meses); curado, de 2 em 2 meses até 12 meses [p.107]."], ["Elaborado por Edjan da Silva Santos – Interno de Medicina, UFAC (Turma 30). Apoio à decisão: a conduta final é do médico responsável.", ""]], "protocolo": [["Caso suspeito – cutânea", "Lesão de pele ulcerada ou não com 3 semanas ou mais de evolução, em residente ou exposto a área de transmissão.", "p.112"], ["Caso suspeito – mucosa", "Lesão de mucosa de vias aéreas superiores, principalmente nasal, em residente ou exposto a área de transmissão.", "p.112"], ["Caso confirmado", "Clínico-laboratorial: área de transmissão + parasito (direto/indireto) OU intradermorreação de Montenegro (IDRM) positiva OU outro método positivo. Clínico-epidemiológico: suspeita clínica sem acesso a exame + área de transmissão (na mucosa, cicatriz cutânea reforça).", "p.112"], ["Úlcera típica", "Indolor, área exposta, redonda/oval, base eritematosa infiltrada e firme, bordas elevadas bem delimitadas, fundo avermelhado com granulações grosseiras. Pode ter linfadenopatia satélite e linfangite nodular (esporotricoide).", "p.41-42"], ["Exame da mucosa", "Sempre examinar mucosas de quem tem forma cutânea: lesões mucosas iniciais podem ser assintomáticas. Maior risco de forma mucosa: lesões múltiplas, extensas, >1 ano, acima da cintura.", "p.54-55"], ["HIV", "Oferecer sorologia para HIV a TODOS os pacientes com leishmaniose tegumentar, independentemente da idade. Quadro 2: situações que sugerem coinfecção (disseminada, mucosa fora do nariz, Montenegro negativo, falha, recidiva tardia...).", "p.63-64"], ["Diagnóstico – fluxo cutâneo", "Suspeito → exame direto e/ou intradermorreação de Montenegro (IDRM). Direto positivo = confirmado → tratar. Negativos → centro de referência para investigar leishmaniose tegumentar e diferenciais. IDRM positiva com direto negativo → considerar prova terapêutica.", "p.69 (Fluxograma 1)"], ["Diagnóstico – fluxo mucoso", "Suspeito de leishmaniose mucosa → centro de referência (cultura, IDRM, PCR, histopatologia, rinoscopia, orofaringoscopia).", "p.70 (Fluxograma 2)"], ["Exame direto", "1ª escolha (rápido, barato). Sensibilidade cai com o tempo de lesão (rara após 1 ano) e com infecção secundária (tratar antes). Escarificação da borda interna da úlcera; lavar com água e sabão, álcool 70%; 1-3 lâminas; fixar em metanol em até 12 h.", "p.67, 164"], ["Intradermorreação de Montenegro", "Pode ser negativa nas primeiras 4-6 semanas; depois positiva em >90%. Negativa com lesão >6 semanas → outras provas e diferencial. Na forma mucosa costuma ser exacerbada; na difusa, negativa. Pode ficar positiva anos após cura.", "p.66-67"], ["Diagnóstico diferencial forma cutânea", "Tuberculose, micobacterioses atípicas, paracoccidioidomicose, úlcera venosa, anemia falciforme, picada de inseto, corpo estranho, ceratoacantoma, CBC, CEC, linfoma, esporotricose, cromoblastomicose, piodermite, trauma.", "p.51-52"], ["Notificação", "Doença de notificação compulsória: todo caso CONFIRMADO notificado e investigado na ficha SINAN (Anexo J). Preencher todos os campos, mesmo negativos/ignorados. Caso importado: notificar também ao município provável de infecção. Para encerrar no SINAN não precisa esperar fim do seguimento.", "p.105, 113, 171-172"], ["Investigação", "Registrar deslocamentos para áreas endêmicas nos 6 meses antes do início dos sintomas; outras pessoas com lesões semelhantes; definir local provável de infecção.", "p.114"], ["Antes de tratar", "Medir as lesões. Avaliar contraindicações. Avaliação clínica antes e durante: ECG, hemograma, ureia/creatinina, amilase/lipase, TGO/TGP, bilirrubinas, GGT, FA. Repouso relativo e sem álcool.", "p.73, 89"], ["forma cutânea localizada – 1ª escolha", "Antimoniato EV/IM 15 mg Sb+5/kg/dia (10-20) por 20 dias, máx 3 amp (1.215 mg)/dia. Exceto comorbidade renal/hepática/cardíaca, gestantes e ≥50 anos → anfotericina B lipossomal. 2ª escolha: desoxicolato de anfotericina B ou pentamidina.", "p.90-92"], ["forma cutânea localizada – intralesional", "Lesão única até 3 cm, exceto cabeça e periarticular, sem imunossupressão (inclui recidiva cútis): antimoniato intralesional ~5 mL/sessão, 1-3 sessões a cada 15 dias, só profissional capacitado. Reavaliar a cada 15 dias até 120 dias.", "p.90, 93-94"], ["forma cutânea localizada – área de L. guyanensis", "Pentamidina 4 mg/kg/dia, 3 doses (72 h IM / 48 h EV), máx 300 mg/dose. Exceto renal/hepática/cardíaca, diabetes, gestante, lactante.", "p.91-92"], ["Espécies no Acre", "Anexo D (dados de 2005): AC tem L. braziliensis, L. lainsoni, L. guyanensis e L. amazonensis. O manual NÃO diz qual predomina em Feijó: confirmar com a vigilância municipal.", "p.159"], ["Recidiva cútis", "Tratar/retratar como forma cutânea localizada. Após 2 esquemas sem resposta → centro de referência.", "p.95"], ["Disseminada", "Preferencialmente centro de referência. Antimoniato 20 mg/kg/dia x 30 dias; lipossomal se ≥50 anos, comorbidade, gestante, grave ou >20 lesões (2-3 mg/kg/dia até 35-40 mg/kg).", "p.95-97"], ["Difusa", "Centro de referência. Pentamidina 4 mg/kg/dia em dias alternados, 10 doses.", "p.97-98"], ["Mucosa", "Preferencialmente centro de referência com otorrino. Antimoniato 20 mg/kg/dia x 30 dias + pentoxifilina 400 mg 8/8h x 30 dias (>12 anos). Lesão de laringe/faringe: internação (risco de edema/insuficiência respiratória), pode-se usar hidrocortisona 100 mg EV 6/6h por 48-72 h.", "p.99-100"], ["Gestante", "Antimoniato contraindicado. Avaliar adiar para pós-parto; se não der, centro de referência com anfotericina B lipossomal.", "p.73, 101"], ["Lactante", "Antimoniato pode ser usado (pouca excreção no leite). Pentamidina contraindicada. Lipossomal: interromper amamentação.", "p.80, 83, 101"], ["Criança", "Esquema do antimoniato igual ao do adulto. Pentamidina CI <1 ano. Pentoxifilina CI <12 anos.", "p.74, 83, 99"], ["≥50 anos / cardio / nefro / hepatopata / transplantado", "Anfotericina B lipossomal 1ª escolha, em centro de referência. Se antimoniato for usado: ECG 2x/semana.", "p.75, 101"], ["HIV / imunossupressão", "Desoxicolato de anfotericina B 1ª escolha (lipossomal se ≥50 anos/comorbidade/gestante). Antimoniato só como 2ª escolha, dose 15 mg/kg. Seguimento por tempo indeterminado; otorrino semestral no 1º ano.", "p.102-104"], ["Monitorização antimoniato", "ECG + hemograma + bioquímica SEMANAIS; ausculta cardíaca diária. ECG: QTc longo é o efeito mais grave. Ototóxico (audiometria em mulheres, idosos, perda auditiva prévia; considerar 5 mg/kg).", "p.73-75, 109-110"], ["Notificar reação adversa grave", "Arritmia, IRA, insuficiência hepática, icterícia ou transaminases Mais de 5x o normal, pancreatite ou amilase/lipase Mais de 5x o normal, óbito. NA DÚVIDA, NOTIFIQUE.", "p.74"], ["Troca antimoniato → anfotericina", "Iniciar desoxicolato só 14 dias após o fim do antimoniato (toxicidade cardíaca/renal).", "p.77, 79"], ["Cuidados locais", "Limpeza com água e sabão; se possível, compressa de permanganato de potássio 1:5.000 (rosa claro). Infecção secundária: cultura se possível e antibiótico. Eczema de contato: corticoide tópico.", "p.91, 109-110"], ["Critério de cura – cutânea", "Epitelização completa de todas as lesões + desaparecimento de crosta, descamação, infiltração e eritema. Epitelização esperada até 90 dias; sinais residuais somem até 180 dias (observar sem tratar se melhora progressiva).", "p.105"], ["2º esquema", "Sem epitelização completa até 90 dias, piora ou lesão nova a qualquer momento.", "p.105"], ["Critério de cura – mucosa", "Regressão de todos os sinais, comprovada por exame otorrino até 6 meses após o fim. Sem especialista: rinoscopia anterior e oroscopia.", "p.107"], ["Seguimento", "Mensal por 3 meses após o fim (HIV: 6 meses). Curado: de 2 em 2 meses até 12 meses após o tratamento.", "p.107, 113"], ["Definições de evolução", "Regular; irregular (passou do tempo previsto); falha = 2 esquemas regulares sem cura; recidiva = nova lesão após cura; abandono = sem cura constatada e não voltou até 30 dias após o 3º agendamento (3º mês).", "p.107-108"], ["Condutas por situação", "Irregular >50% das doses: curado → alta; melhora → observar 3 meses; sem melhora → reiniciar. <50% → reiniciar. Falha → 2ª escolha. Recidiva/abandono → reiniciar 1ª escolha.", "p.108-109"], ["Centro de referência no Acre", "Estadual: SAE, BR-364 km 2, Estrada Dias Martins, Distrito Industrial, Rio Branco, tel. (68) 3223-8571 / 3223-8353. Municipal: URAP Augusto Hidalgo de Lima, Rua Tião Natureza 271, Palheiral, Rio Branco, tel. (68) 3225-6495 / 3242-0490. (Dados de 2017, confirmar.)", "p.179"], ["FORA DO MATERIAL – confirmar", "O manual é de 2017. Depois dele o MS incorporou a miltefosina oral para leishmaniose tegumentar no SUS (Portaria SCTIE/MS nº 56/2018) e atualizou o capítulo de leishmaniose tegumentar no Guia de Vigilância em Saúde (6ª ed., 2023). Confirmar com a vigilância/preceptor antes de usar; não consta no material.", "externo"]], "referencias": [["Fonte principal", "BRASIL. Ministério da Saúde. Secretaria de Vigilância em Saúde. Departamento de Vigilância das Doenças Transmissíveis. Manual de Vigilância da Leishmaniose Tegumentar. Brasília: Ministério da Saúde, 2017. 189 p.", ""], ["Como citar esta planilha", "SANTOS, Edjan da Silva function diaTrat(c,p,r){
  const A=pd(c.data); if(!A||!p) return '';
  const X=r.fim, Y=pd(p.inicio);
  if(X&&A>X) return diff(A,X)+' dias após o fim do tratamento';
  if(Y&&A>=Y) return 'dia '+(diff(A,Y)+1)+' do tratamento';
  return '';
}

/* --- leitura da planilha .xlsx --- */
async function unzip(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-70000);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break;}}
  if(e<0)throw new Error('arquivo não é uma planilha .xlsx');const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};const dec=new TextDecoder();
  for(let k=0;k<n;k++){const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl));const lnl=dv.getUint16(lo+26,true),lxl=dv.getUint16(lo+28,true);const data=u.subarray(lo+30+lnl+lxl,lo+30+lnl+lxl+csz);
    out[name]={meth,data};p+=46+nl+xl+cl;}
  return async name=>{const f=out[name];if(!f)return null;if(f.meth===0)return dec.decode(f.data);
    if(typeof DecompressionStream==='undefined')throw new Error('este navegador não lê planilhas; atualize o Chrome/Edge');
    const s=new Blob([f.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return await new Response(s).text();};}
function ddmmaa(v){if(v==null||v==='')return null;if(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(0,10);
  const n=Math.round(+v);if(!isFinite(n)||n<=0)return null;const yy=new Date().getFullYear()%100;
  const tryD=(d,m,y)=>{const dt=new Date(y,m-1,d);return(dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d)?iso(dt):null;};
  let s=String(n);if(s.length<=6){s=s.padStart(6,'0');const y2=+s.slice(4,6);const r=tryD(+s.slice(0,2),+s.slice(2,4),y2>yy?1900+y2:2000+y2);if(r)return r;}
  else if(s.length<=8){s=s.padStart(8,'0');const r=tryD(+s.slice(0,2),+s.slice(2,4),+s.slice(4,8));if(r)return r;}
  if(n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+n*86400000);return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));}return null;}
async function readPlanilha(buf){
  const get=await unzip(buf);const wb=await get('xl/workbook.xml'),rels=await get('xl/_rels/workbook.xml.rels');if(!wb)throw new Error('arquivo não é uma planilha .xlsx');
  const ss=[];const sst=await get('xl/sharedStrings.xml');const dp=new DOMParser();
  if(sst){dp.parseFromString(sst,'application/xml').querySelectorAll('si').forEach(si=>ss.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join('')));}
  const rd=dp.parseFromString(rels,'application/xml');const target={};rd.querySelectorAll('Relationship').forEach(r=>target[r.getAttribute('Id')]=r.getAttribute('Target'));
  const sheets={};dp.parseFromString(wb,'application/xml').querySelectorAll('sheet').forEach(s=>{const id=s.getAttribute('r:id')||s.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');let t=target[id]||'';t=t.replace(/^\/?xl\//,'');sheets[s.getAttribute('name')]='xl/'+t;});
  async function rows(name){const path=sheets[name];if(!path)throw new Error('a planilha não tem a aba '+name);const x=dp.parseFromString(await get(path),'application/xml');const out={};
    x.querySelectorAll('sheetData row').forEach(row=>{const rn=+row.getAttribute('r');if(rn<5)return;const o={};row.querySelectorAll('c').forEach(c=>{const ref=c.getAttribute('r').replace(/\d+/g,'');const t=c.getAttribute('t');const vEl=c.getElementsByTagName('v')[0];
      let v=null;if(t==='s'&&vEl)v=ss[+vEl.textContent];else if(t==='inlineStr'){v=Array.from(c.getElementsByTagName('t')).map(z=>z.textContent).join('');}else if(t==='str'||t==='e'){v=null;}else if(vEl){v=+vEl.textContent;}
      if(c.getElementsByTagName('f')[0]&&t!=='s'&&t!=='inlineStr'&&!['A','B'].includes(ref)){/* célula de fórmula: ignorar */ if(!isFinite(v))v=null;}
      if(v!==null&&v!=='')o[ref]=v;});out[rn]=o;});return out;}
  const pr=await rows('PACIENTES'),cr=await rows('CONSULTAS');const patients=[],consults=[];
  const conv=(cols,o)=>{const r={};cols.forEach(([c,k,t])=>{let v=o[c];if(v==null||v==='')return;if(t==='d')v=ddmmaa(v);else if(t==='n'||t==='o'){v=typeof v==='number'?v:parseFloat(String(v).replace(',','.'));if(!isFinite(v))return;}else v=String(v);if(v!=null)r[k]=v;});return r;};
  Object.values(pr).forEach(o=>{const p=conv(PCOL,o);if(isNum(p.id)&&p.id>0)patients.push(p);});
  Object.values(cr).forEach(o=>{const c=conv(CCOL,o);if(isNum(c.cod)&&c.cod>0&&(c.data||c.tipo)){c.uid=Date.now()+Math.random();consults.push(c);}});
  if(!patients.length)throw new Error('nenhum paciente encontrado na aba PACIENTES');
  return{patients,consults};
}

function autoP(p,k){const a=calc(p).idade;const out=isNum(a)&&(a<10||a>=50);
  if(k==='sexo'){if(p.sexo===1){p.gest=3;p.lact=2;}else{if(p.gest===3&&!out)p.gest=null;}}
  if((k==='sexo'||k==='nasc')&&p.sexo===2&&out&&p.gest==null)p.gest=3;

/* droga correspondente ao tratamento indicado pelo manual (null = decidir no centro de referência) */
function drogaDe(t){if(!t)return null;if(t.startsWith('Pentamidina contraindicada'))return null;
  if(t.startsWith('Anfotericina B lipossomal'))return 4;if(t.startsWith('Desoxicolato'))return 5;if(t.startsWith('Pentamidina'))return 3;
  if(/\+ pentoxifilina/.test(t))return 6;if(t.startsWith('Antimoniato')||t.startsWith('Área L. guyanensis'))return 1;return null;}

/* ---------- automações da consulta ---------- */
function tipoAuto(p,c){const r=calc(p),A=pd(c.data),ini=pd(p.inicio);if(!A||!ini||A<ini)return 1;
  if(diff(A,ini)===0)return 2;if(!r.fim||A<r.fim)return 3;if(diff(A,r.fim)===0)return 4;return 5;}
function retornoAuto(p,c){const r=calc(p),A=pd(c.data);if(!A)return null;if([5,8,9,10].includes(p.sit))return null;
  const n=r.agenda.map(x=>x.d).filter(d=>d>A).sort((x,y)=>x-y)[0];return n?iso(n):null;}
function novaConsulta(p){const c={uid:Date.now(),cod:p.id,data:iso(today())};const lc=lastC(p.id);
  if(lc&&lc.peso)c.peso=lc.peso;else if(p.peso)c.peso=p.peso;
  c.tipo=tipoAuto(p,c);const rt=retornoAuto(p,c);if(rt)c.retorno=rt;
  S.consults.push(c);editC=c.uid;save();return c;}
const nf1=v=>(Math.round(v*10)/10).toLocaleString('pt-BR');
function prescr(p){const r=calc(p);const d=p.droga||drogaDe(r.trat);const o=[];
  if((d===1||d===6)&&isNum(r.mg))o.push(`Antimoniato de meglumina ${r.dose} mg Sb+5/kg/dia: ${Math.round(r.mg).toLocaleString('pt-BR')} mg Sb+5/dia = ${nf1(r.ml)} mL (${r.amp.toLocaleString('pt-BR')} ampola${r.amp>1?'s':''} de 5 mL), EV lenta ou IM, 1 vez ao dia, por ${r.dur} dias.`);
  if(d===6)o.push('Pentoxifilina 400 mg VO de 8/8h por 30 dias.');
  if(d===3&&isNum(p.peso)&&/3 doses/.test(r.trat))o.push(`Isetionato de pentamidina 4 mg/kg/dose: ${Math.round(Math.min(p.peso*4,300))} mg por dose (máx. 300 mg), 3 doses, de 72/72h IM ou 48/48h EV. Paciente alimentado antes e em repouso 15 min após.`);
  return o.join(' ');}
function chipsQ(){return [['Sem queixas','Sem queixas.'],['Nega palpitação, zumbido, tontura','Nega palpitação, zumbido e tontura.'],['Lesão melhorando','Refere melhora da lesão.'],['Dor no local da aplicação','Refere dor no local da aplicação.']];}
function chipsC(p,c){const r=calc(p);const L=[];const rx=prescr(p);
  if(rx)L.push(['Prescrição calculada',()=>prescr(p)]);

function soapText(p){

  const dm=(c&&isNum(c.diam))?c.diam:p.diam;

  if(c&&(c.ecg||c.ur||c.tgo||c.ami||c.hemo)) O.push(`Monitorização: ECG ${low(lab('ecg',c.ecg)||'não informado')}; ureia/creatinina ${low(lab('ur',c.ur)||'não informado')}; TGO/TGP/bilirrubinas ${low(lab('tgo',c.tgo)||'não informado')}; amilase/lipase ${low(lab('ami',c.ami)||'não informado')}; hemograma ${low(lab('hemo',c.hemo)||'não informado')}.`);

V.ajuda=()=>`<div><h1>Como usar</h1><p class="lead">Quase tudo é marcado com toques. O que dá para deduzir, o aplicativo preenche sozinho.</p></div>
  <section class="tut"><div class="tut-h"><span class="tag">Vídeo tutorial</span><h2>Aprenda em 4 minutos</h2><p>O vídeo mostra o aplicativo do início ao fim, com um paciente fictício.</p></div>${videoBlock('va')}</section>
  <section class="panel prose"><h2>Passo a passo com paciente novo</h2>
   <p><b>1. Novo paciente.</b> O código (LT-001, LT-002…), a data de hoje, a cidade e a unidade do último cadastro já vêm preenchidos. Digite nome, nascimento e peso; o resto é com toques. “Nenhuma comorbidade” responde 5 perguntas de uma vez. O quadro “Resultado do protocolo” mostra tratamento, dose, encaminhamento e alertas na hora.</p>
   <p><b>Início do tratamento:</b> o botão “Iniciar hoje” registra o remédio indicado, a data de início e a situação, e monta a agenda.</p>
   <p><b>2. Registrar consulta agora</b> a cada atendimento. Data, tipo, peso e próximo retorno vêm prontos. Use os atalhos de queixas, “Exames normais” e “Prescrição calculada”. O quadro “Alerta do manual” avisa quando suspender, notificar reação, indicar 2º esquema ou dar critério de cura.</p>
   <p><b>3. SOAP:</b> ao concluir a consulta, toque em “Copiar SOAP completo” e cole no PEC.</p>
   <p><b>4. Ficha (PDF):</b> imprima ou salve em PDF para referência, preceptor ou vigilância.</p>
   <p><b>5. Agenda:</b> exames semanais durante o tratamento e retornos até a alta, calculados sozinhos.</p></section>
  <section class="panel prose"><h2>Instalar como aplicativo</h2>
   <p><b>Celular Android (Chrome):</b> abra o link, toque nos três pontinhos › “Adicionar à tela inicial” ou “Instalar app”.</p>
   <p><b>iPhone (Safari):</b> toque em Compartilhar › “Adicionar à Tela de Início”.</p>
   <p><b>Notebook (Chrome ou Edge):</b> clique no ícone de instalar na barra de endereço, ou no botão verde “Instalar” no topo do aplicativo.</p>
   <p>Depois de instalado, abre pelo ícone e funciona sem internet.</p></section>
  <section class="panel prose"><h2>Privacidade (LGPD)</h2>
   <p>Os dados ficam só no aparelho em que foram digitados. Nada é enviado para servidor. Cada médico tem os próprios pacientes no próprio celular ou notebook.</p>
   <p>Por isso, faça backup em <a href="#dados">Dados e backup</a> de vez em quando. Para levar os dados do celular para o notebook, exporte o backup em um e importe no outro.</p>
   <p>Para mandar informação a alguém, envie só a ficha em PDF daquele paciente e só para quem cuida dele. CPF e nome da mãe não são necessários aqui.</p></section>
  <section class="panel prose"><h2>Aviso</h2><p>${esc(CONTENT.aviso)}</p></section>`;

function merge(ps,cs){let np=0,nc=0;ps.forEach(p=>{if(!isNum(p.id))return;const i=S.patients.findIndex(x=>x.id===p.id);if(i>=0)S.patients[i]=p;else S.patients.push(p);np++;});
  cs.forEach(c=>{if(!isNum(c.cod))return;const dup=S.consults.find(x=>x.cod===c.cod&&x.data===c.data&&x.tipo===c.tipo&&(x.conduta||'')===(c.conduta||''));if(dup)return;c.uid=c.uid||Date.now()+Math.random();S.consults.push(c);nc++;});return{np,nc};}
function download(name,bytes,type){const b=new Blob([bytes],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Arquivo '+name+' gerado.');}

async function doInstall(){

  if(isIOS()){let m=$('#instm');if(m)m.remove();m=document.createElement('div');m.id='instm';m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
